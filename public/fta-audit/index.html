, "fz/fz/38-fz-tax-credit-schedule-17.png": "G4 (`g_use_tax_credits_q`) = Yes → Tax-Credit schedule #17 (S080) renders inline — Country / Taxable Income / Tax liability in the foreign jurisdiction / evidence / nature columns."}, "linked": [{"n": "1", "doc": "CT Guide on Determination of Taxable Income", "refs": "§3.3, §9.1, §9.2, §10.2, §10.4, §17, §19", "have": "YES (linked/)"}, {"n": "2", "doc": "CT Guide on Free Zone Persons", "refs": "§4.3, §12 (many)", "have": "YES (linked/)"}, {"n": "3", "doc": "CT Guide on Accounting Standards and Interaction with Corporate Tax", "refs": "§4.1.4/4.2.7, §5.1, §5.2, §6, §7.2, §9.3.6, §21, §22.2, §22.3", "have": "YES (linked/)"}, {"n": "4", "doc": "CT Guide on Transfer Pricing", "refs": "§4.2.1, §9.2.6, §9.3, §12.1.36–37, §16", "have": "YES (linked/)"}, {"n": "5", "doc": "CT Guide on Tax Groups", "refs": "§4.5, §6.1, §10.3, §15.2, §17B, §19", "have": "YES (linked/)"}, {"n": "6", "doc": "CT Guide on Taxation of Partnerships", "refs": "§4.1.1, §4.2.2, §4.4, §7.3", "have": "YES (linked/)"}, {"n": "7", "doc": "CT Guide on Taxation of Natural Persons under the Corporate Tax Law", "refs": "§4.1.3, §4.1.9", "have": "YES (linked/)"}, {"n": "8", "doc": "CT Guide on Non-Resident Persons", "refs": "§4.1.10, §4.2.13–16, §7.9", "have": "YES (linked/)"}, {"n": "9", "doc": "CT Guide on Small Business Relief", "refs": "§5.3", "have": "YES (linked/)"}, {"n": "10", "doc": "CT Guide on Qualifying Group Relief", "refs": "§5.4, §8.1, §20A", "have": "YES (linked/)"}, {"n": "11", "doc": "CT Guide on Business Restructuring Relief", "refs": "§5.5, §8.2, §20B", "have": "YES (linked/)"}, {"n": "12", "doc": "CT Guide on Taxation of Foreign Source Income", "refs": "§5.6, §7.8, §14, §15.1", "have": "YES (linked/)"}, {"n": "13", "doc": "CT Guide on Exempt Income: Dividends and Participation Exemption", "refs": "§7.7, §13, §18, §21.4", "have": "YES (linked/)"}, {"n": "14", "doc": "CT Guide on Investment Funds and Investment Managers", "refs": "§9.4", "have": "YES (linked/)"}, {"n": "15", "doc": "Corporate Tax — General Guide", "refs": "§7.9", "have": "YES (linked/)"}, {"n": "16", "doc": "Tax Procedures Guide on Tax Resident and Tax Residency Certificate", "refs": "§4.2.13, §4.2.16", "have": "YES (linked/)"}, {"n": "17", "doc": "EmaraTax Tax Return User Manual (portal technical manual)", "refs": "§2.3", "have": "**YES — obtained 16-Aug 15:xx from the owner: `linked/EmaraTax-CT-Return-Taxpayer-User-Manual-V4-2024-09-17.pdf` (Taxpayer User Manual — Corporate Tax Return, v4.0.0.0, 17-Sep-2024, 162 pp; screen-by-screen in portal tab order)**"}], "secnames": {"0": "§0 Principles", "3": "§3 Overview", "4": "§4 Taxable Person details", "5": "§5 Elections", "6": "§6 Accounting Schedule", "7": "§7 Accounting adjustments & Exempt Income", "8": "§8 Reliefs", "9": "§9 Other adjustments", "10": "§10 Tax liability & credits", "11": "§11 Review & declaration", "12": "Sch 12 Free Zone / IP", "13": "Sch 13 UAE Dividends", "14": "Sch 14 Foreign PE", "15": "Sch 15 Tax Credits", "16": "Sch 16 Related Party / Connected Persons", "17": "Sch 17 Tax Losses", "18": "Sch 18 Participation Exemption", "19": "Sch 19 Interest Capping", "20": "Sch 20 QG / BRR reliefs", "21": "Sch 21 Transitional", "22": "Sch 22 Other schedules / attachments", "23": "§23 Exempt Persons", "24": "§24 Guide version"}, "plain": {"FTA-001": "The guide hides the realisation-basis and transitional elections, the OCI questions and the transitional adjustments when the financial statements are on the CASH basis (and reduces the Accounting Schedule to the Income Statement). Our product asks cash/accrual but does not use the answer anywhere downstream. Ask: should we add this gate?", "FTA-002": "The guide hides 'prior-period unrealised gains now realised' (7.5.4–7.5.6) and 'prior-period error ≤ AED 10k' (9.5.1) in the FIRST Tax Period return. Our product shows them in year 1 too (it does hide the Foreign-PE prior-period block correctly). Ask: apply the first-period hide to these too?", "FTA-003": "The guide shows the realisation-basis adjustments block only if the realisation basis was elected; ours shows it always. The guide (and the portal) also has a free-text description for these adjustments which we lack. (The portal has ONE depreciation row like ours, so the guide's second row is not counted against us.)", "FTA-004": "The guide's residency questions branch: UAE-incorporated → DTA questions; foreign-incorporated → 'effectively managed in the UAE?' (POEM) → country of incorporation. Ours is a flat line (incorporated? DTA? non-resident? PE/nexus) — fine for UAE-incorporated companies (matches the portal screen for that persona), but a foreign-incorporated company managed from the UAE cannot be classified. Ask: do your clients include such entities?", "FTA-005": "One Taxpayer-Details questionnaire serves natural persons, companies, partnerships and tax groups; the persona-specific meanings (e.g. natural-person turnover exclusions, 'any member' for groups) are left to the preparer's knowledge. Low impact; noted.", "FTA-006": "Reporting-only items the portal pre-fills from EmaraTax registration (list of businesses, % revenue per sector, country of incorporation, header details) are not in our product. The guide says they do not affect Taxable Income. Recorded, not counted as defects.", "FTA-007": "Small Business Relief: we check revenue ≤ AED 3m (this year), not an MNE member, not a QFZP. The guide also requires Resident status and revenue ≤ 3m in ALL previous periods; and it hides the SBR block when ineligible where we show it disabled with a reason. Ask: add the two conditions (the prior-period one belongs to the year-2 work)?", "FTA-008": "Rules that depend on prior-period state — QG election pre-set to Yes once made, the elect-out-of-QFZP question disappearing in later years, the 5-period QFZP lock after a de-minimis failure or a 'No' confirmation — are not carried forward. Mayuresh has parked this whole family until year-2 returns are prepared. Listed for completeness.", "FTA-009": "The Free-Zone confirmations (adequate assets/employees/opex, arm's length, TP documentation, audited FS) are tick-boxes — same as the portal. But the guide's consequence 'if any is No, not a QFZP for this and the next 4 periods' is not enforced anywhere. Ask: should an un-ticked confirmation block the 0% treatment in the current period?", "FTA-010": "Free-Zone schedule shapes: the portal shows BOTH employee-count fields side by side (we reveal one or the other from 'all employees in FZ?'); 'Qualifying Activities undertaken' is a multi-select list in the portal (ours is free text); the outsourcing provider count and the single supervision confirmation follow your earlier rulings.", "FTA-011": "Qualifying-IP nexus (S050): the FTA Free-Zone guide says Qualifying and Overall Expenditure accumulate over the LIFE of the IP asset; our schedule (and the delivered S050 sheet) capture the current period only, so the nexus ratio would drift from year 2. The formula itself is correct (matches the FTA worked examples). Ask: cumulative or per-period?", "FTA-012": "Participation Exemption: the exempt total is a manual placeholder per your earlier agreement (OW-25). Two points: the guide's '<5% ownership AND <AED 4m cost ⇒ PE not available' warning is absent; and where you asked us to BLOCK a row answered 'No' on the 12-month/other-conditions questions, the guide says the portal only WARNS. Ask: confirm block vs warn; add the <5%/<4m warning?", "FTA-013": "Interest capping: the formula core is right, but three inputs never reach the engine — brought-forward disallowed interest (engine computes with 0), interest INCOME (no field, so net = gross expenditure), and expired tranches. The Bank/Insurer/natural-person exemption cannot be set from the wizard. The portal captures all of these in its Interest Capping popup. Sits under your open Q18.", "FTA-014": "Related-Party / Connected-Person: thresholds, dropdowns and TP methods match. Two of your rulings are honoured (signed two-way RP adjustment — the portal computes the same direction; CP floor at zero). One un-ruled clause: a DOWNWARD TP adjustment is allowed only after a successful FTA application — we have no gate/attestation. And a three-way tension: portal auto-fills 'Additions… not at arm's length' from the schedule; guide says manual ≥ schedule; we key it manually (your RULING 124).", "FTA-015": "Several Section-F amounts are captured but do not feed the computation (SIDLR non-deductible interest, QIF shares/distributions, 'other adjustments', gains/losses on assets received from related parties at non-arm's-length). The computation template only has generic lines, so the preparer keys them twice. Ask: should these flow automatically?", "FTA-016": "Section-F line gaps: no 'amounts withdrawn by a natural person' line (natural persons are in scope); donations are not validated against the Accounting-Schedule donations figure; entertainment is fixed at exactly 50% per your ruling (guide allows more). The 'other adjustments' description exists in the guide but not in the portal — not counted.", "FTA-017": "International aircraft/shipping questions exist only on our Free-Zone template — faithful to your V2 workbooks (the non-FZ workbook has no such rows). The guide places them on Non-Resident returns generally. One line for you: does the non-FZ template need them?", "FTA-018": "Transitional adjustments: the four transitional schedules compute the excluded amounts correctly, but those amounts are NOT yet wired into the Taxable-Income computation (open item Q-V2-061). Also: cash-basis pre-fill 'No' absent; the QFA/QFL disposal question sits at top level rather than under 'held qualifying assets?'.", "FTA-019": "Foreign-PE schedule: no field for 'FPE losses offset against subsequent FPE income' and no 'if greater than losses utilised, the exemption is not available this period' test; no auto carry-forward; prior-period rows are typed/uploaded, not pre-populated. The FPE result is not wired to the computation (your open Q24).", "FTA-020": "Everything the guide says about TAX GROUPS (group Taxpayer Details, group loss schedule, pre-grouping losses/interest, group FTC attribution) is out of V1 scope — Phase 2 per the signed scope and your 26-Jun answer. Listed as a Phase-2 inventory, not as findings.", "FTA-021": "Reliefs (QG transfers / BRR): our Section E has 6 fields each; the guide AND the portal have 14 (clawback yes/no, gains/losses now realised, other clawback adjustments, description). This comes from the V2 E-sheet we were given. Also the QG current-period gain/loss is captured but not fed to the computation while the BRR equivalent is (your open Q16); and the two 'need adjustments?' questions show even when the election was not made.", "FTA-022": "Tax liability & credits: the 'use tax credits?' question is not hidden when there is a Tax Loss; the typed tax-credit claim is not pre-populated from the schedule (portal greys it in) — your open Q22. The portal, like us, has a single tax-losses question, so the guide's extra 'brought-forward losses?' question is not counted.", "FTA-023": "Tax losses: 'available for transfer' formula still undelivered (Q19), the transfer banner uses Taxable-Income-before-relief as a proxy (Q20), own-losses-first / recipient 75% caps not validated. Not yet ruled: for a QFZP, losses attributable to Qualifying Activities should be EXCLUDED from the loss schedule — we have no such split.", "FTA-024": "Foreign tax credit: the per-country cap ('UAE tax due on that income' vs foreign tax, lesser of) is applied only globally at the end — the portal computes it per stream (your open Q22). The 'evidence of foreign tax paid' attachment slot is absent.", "FTA-025": "Transitional schedules: one un-ruled invariant — for LIABILITY rows the 'exempt under Participation Exemption?' answer must always be No (a liability cannot be a participation); ours allows Yes. Everything else follows earlier rulings.", "FTA-026": "Other schedules: no 'deferred gains/losses realised this period' schedule (its two output amounts exist as manual fields); the OCI-schedule fields stay visible-but-optional where the guide hides them; unrealised gains/losses are captured raw without the financial vs non-financial asset rule; the FS attachment is advisory with no SBR carve-out. Ask on the deferred schedule.", "FTA-027": "Accounting Schedule: the guide pre-fills 'audited = Yes' when revenue > AED 50m or QFZP; we force it only for QFZP.", "FTA-028": "Declaration block: matches the PORTAL exactly (greyed date, 'prepared by: Taxable Person', one checkbox with both statements). The guide's richer shape (agent/legal-representative choice, capacity) is not the live portal — not counted.", "FTA-029": "Exempt Persons (government/extractive): our short-return route exists; the guide's restrictions for these entities (no QG relief/BRR/loss transfer) are not enforced. Rare persona; low.", "FTA-030": "Structure: schedules render inline (as the portal does for most blocks) rather than as the guide's 'directed to schedule and back'; the return is tailored by answers rather than registration data. Ruled/by-nature; no action.", "FTA-INFO": "Guide clauses that are preparer instructions rather than portal validations (e.g. exclude declared dividends from equity-method figures, exclude Exempt-Person dividends, no liquidation losses) — recorded as covered with a note; hints could be added cheaply."}};</script><script>
const D=window.FTA_DATA; const $=(s,el=document)=>el.querySelector(s); const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){let h=esc(s);h=h.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');const L=h.split('\n');let o='',ul=false;for(const ln of L){if(/^\s*[-•]\s+/.test(ln)){if(!ul){o+='<ul>';ul=true;}o+='<li>'+ln.replace(/^\s*[-•]\s+/,'')+'</li>';}else{if(ul){o+='</ul>';ul=false;}if(ln.trim())o+='<p>'+ln+'</p>';}}if(ul)o+='</ul>';return o;}
function vchip(v){return `<span class="chip v-${esc(v)}">${esc(v)}</span>`;}
function impChip(t){const c=/HIGH/.test(t)?'':(/MEDIUM/.test(t)?' m':' l');return `<span class="chip imp${c}">${esc(t)}</span>`;}
function thumbs(list){return list&&list.length?`<div class="thumbs">${list.map(e=>`<a href="#" onclick="return lb('${e}')"><img loading="lazy" src="img/${e.replace(/\.png$/,'.jpg')}" alt=""><span>${esc((D.captions[e]||e.split('/').pop()).slice(0,60))}</span></a>`).join('')}</div>`:'';}
// ---- comments backend (Supabase REST) with local fallback ----
const CFG=window.FTA_COMMENTS||null; const LS='fta-audit-comments-v2'; let remote=[]; let live=false;
const loadLocal=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return[];}}; const saveLocal=a=>localStorage.setItem(LS,JSON.stringify(a));
const hdr=()=>({apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'});
const PC = ()=>CFG&&CFG.table==='prototype_comments';
async function remoteFetch(){ if(!CFG||!CFG.url||!CFG.key) return; try{const q=PC()?`route=eq.${encodeURIComponent(CFG.page)}`:`page=eq.${encodeURIComponent(CFG.page)}`; const r=await fetch(`${CFG.url}/rest/v1/${CFG.table}?${q}&order=created_at.asc&select=*`,{headers:hdr()}); if(r.ok){const rows=await r.json(); remote=PC()?rows.filter(x=>!/^FTA-AUDIT (probe|e2e test)$/.test(x.commenter||'')).map(x=>({anchor:x.screen,section:x.section,commenter:x.commenter,choice:x.kind&&x.kind!=='comment'?x.kind:null,body:x.body,created_at:x.created_at})):rows; live=true;} else live=false;}catch(e){live=false;} status(); }
async function remotePost(c){ if(!CFG||!CFG.url||!CFG.key) return false; try{const r=await fetch(`${CFG.url}/rest/v1/${CFG.table}`,{method:'POST',headers:{...hdr(),Prefer:'return=minimal'},body:JSON.stringify(PC()?{route:CFG.page,screen:c.anchor,section:c.section||null,commenter:c.who,body:c.text||(c.choice?'('+c.choice+')':''),kind:c.choice||'comment'}:{page:CFG.page,anchor:c.anchor,section:c.section||null,commenter:c.who,choice:c.choice||null,body:c.text||''})}); return r.ok;}catch(e){return false;} }
async function syncPending(){ const a=loadLocal(); let ch=false; for(const c of a){ if(!c.synced){ if(await remotePost(c)){c.synced=true;ch=true;} } } if(ch) saveLocal(a); }
function all(anchor){ const rem=remote.filter(c=>c.anchor===anchor).map(c=>({anchor:c.anchor,who:c.commenter,text:c.body,choice:c.choice,when:c.created_at,synced:true})); const loc=loadLocal().filter(c=>c.anchor===anchor&&!c.synced); return [...rem,...loc]; }
function status(){ const el=$('#cst'); if(!el) return; const pend=loadLocal().filter(c=>!c.synced).length; el.innerHTML = live? `● Comments save to the shared database${pend?` · ${pend} pending sync`:''}` : (CFG&&CFG.url? `● Database not reachable — comments kept on this device${pend?` (${pend})`:''}; they sync automatically when it is back` : `● Comments are kept on this device — use “Export my answers” to send them`) + `<br><a href="#" id="exp" style="color:#c9d8f0">Export my answers</a>`; $('#exp')&&$('#exp').addEventListener('click',e=>{e.preventDefault();exportAll();}); }
function renderC(anchor,el){ const l=all(anchor); el.innerHTML=l.length?l.map(c=>`<div class="c"><span class="who">${esc(c.who||'Anonymous')}</span>${c.choice?` <span class="chip v-${/^Discuss/i.test(c.choice)?'PARTIAL':(/^No|^None|^Not|^Keep|^Current|^Only|^No such/i.test(c.choice)?'KNOWN':'COVERED')}">${esc(c.choice)}</span>`:''}<span class="when">${esc((c.when||'').toString().slice(0,16).replace('T',' '))}${c.synced?' · saved':' · on this device'}</span>${c.text?`<div>${esc(c.text)}</div>`:''}</div>`).join(''):`<div class="small muted">No answer yet.</div>`; }
function callbox(anchor,label,options){ const id='cb-'+anchor.replace(/[^a-z0-9]/gi,'_'); return `<div class="callbox" data-anchor="${esc(anchor)}"><b>${esc(label)}</b>${options&&options.length?`<div class="opts">${options.map(o=>`<label><input type="radio" name="${id}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`:''}<textarea placeholder="Your comment / ruling / condition (optional if you picked an option above)…"></textarea><div class="row"><input type="text" class="who" placeholder="Your name" value="${esc(localStorage.getItem('fta-who')||'')}"><button class="btn save">Save answer</button><span class="small muted saved"></span></div><div class="clist"></div></div>`; }
function wire(){ $$('.callbox').forEach(box=>{ const anchor=box.dataset.anchor; const list=$('.clist',box); renderC(anchor,list); $('.save',box).addEventListener('click',async()=>{ const who=$('.who',box).value.trim(); if(!who){alert('Please add your name so we know who answered.');$('.who',box).focus();return;} localStorage.setItem('fta-who',who); const text=$('textarea',box).value.trim(); const choice=($('input[type=radio]:checked',box)||{}).value||''; if(!text&&!choice){alert('Pick an option or write a comment.');return;} const c={anchor,who,text,choice,when:new Date().toISOString(),synced:false}; const ok=await remotePost(c); c.synced=ok; const a=loadLocal(); a.push(c); saveLocal(a); $('textarea',box).value=''; $('.saved',box).textContent=ok?'Saved to the shared database ✓':'Saved on this device ✓ (will sync / export)'; if(ok) await remoteFetch(); renderC(anchor,list); status(); markDone(); }); }); }
function markDone(){ const answered=new Set([...remote.map(c=>c.anchor),...loadLocal().map(c=>c.anchor)]); let n=0; D.decisions.forEach(d=>{const on=answered.has('decision-'+d.n); if(on)n++; const a=$(`a.nav[data-view="decision-${d.n}"]`); a&&a.classList.toggle('done',on);}); const p=$('#prog'); if(p){p.querySelector('span').textContent=`${n} of ${D.decisions.length} answered`; p.querySelector('i').style.width=(100*n/D.decisions.length)+'%';} }
function exportAll(){ const a=[...remote.map(c=>({anchor:c.anchor,who:c.commenter,choice:c.choice,text:c.body,when:c.created_at})),...loadLocal().filter(c=>!c.synced)]; const lines=['# FTA audit — answers export','','Exported: '+new Date().toISOString(),'']; a.forEach(c=>lines.push(`- **${c.anchor}** · ${c.who} · ${c.when}${c.choice?' · **'+c.choice+'**':''}\n  ${c.text||''}`)); const txt=lines.join('\n')+'\n\n```json\n'+JSON.stringify(a,null,1)+'\n```\n'; const blob=new Blob([txt],{type:'text/markdown'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='fta-audit-answers-'+new Date().toISOString().slice(0,10)+'.md'; document.body.appendChild(l); l.click(); l.remove(); navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{}); alert('Answers exported (downloaded + copied). Please send the file to Mayuresh.'); }
// ---- views ----
function decisionView(d,i){ const prev=D.decisions[i-1], next=D.decisions[i+1]; const f=d.finding?D.findings.find(x=>x.id===d.finding):null; return `<section class="view" id="v-decision-${d.n}"><div class="small muted">Decision ${d.n} of ${D.decisions.length} · ${esc(d.area)} · ${impChip('Impact: '+d.impact)} ${f?`· <a href="#findings" onclick="go('findings');setTimeout(()=>{const e=document.getElementById('${f.id}');if(e){e.open=true;e.scrollIntoView();}},50);return false;">detail: ${f.id}</a>`:''}</div><h2>${esc(d.title)}</h2>
<div class="card"><div class="blk"><div class="k">Background</div><div class="val">${md(d.background)}</div>
<div class="k">What the FTA guide says <span>Returns guide / linked FTA guide</span></div><div class="val guide">${md(d.guide)}</div>
<div class="k">What EmaraTax shows <span>User Manual v4</span></div><div class="val portal">${md(d.portal)}</div>
<div class="k">What our product does today <span>build 9b45d722</span></div><div class="val product">${md(d.product)}${thumbs(d.evidence)}</div>
<div class="k">Why it matters</div><div class="val why">${md(d.why)}</div></div>
<div class="q"><div class="qq">Your call</div><p>${md(d.question)}</p>${callbox('decision-'+d.n,'Answer',d.options)}</div></div>
<div class="pager">${prev?`<button class="btn sec" onclick="go('decision-${prev.n}')">← Decision ${prev.n}</button>`:`<button class="btn sec" onclick="go('start')">← Start</button>`}${next?`<button class="btn" onclick="go('decision-${next.n}')">Decision ${next.n} →</button>`:`<button class="btn" onclick="go('strong')">Done — see what's solid →</button>`}</div></section>`; }
function render(){
  const T=D.meta.tally;
  $('#nav').innerHTML = D.sections.map(([id,name,desc])=>{ if(id==='decisions'){ return `<div class="grp">Decisions — answer each</div>`+D.decisions.map(d=>`<a class="nav dec" data-view="decision-${d.n}" href="#decision-${d.n}"><span class="b">${d.n}</span>${esc(d.title)}<span class="d">${esc(d.area)} · ${esc(d.impact)}</span></a>`).join('')+`<div class="prog" id="prog"><span>0 of ${D.decisions.length} answered</span><div class="bar"><i></i></div></div><div class="grp">Reference</div>`; } return `<a class="nav" data-view="${id}" href="#${id}">${esc(name)}<span class="d">${esc(desc)}</span></a>`; }).join('');
  let v=`<section class="view" id="v-start"><h2>Start here</h2><div class="card"><p><b>What this is.</b> We compared the FTA's <i>Corporate Tax Guide — Tax Returns</i> (Nov-2024, your copy) and the EmaraTax <i>Taxpayer User Manual</i> (Sep-2024) — field by field, including every "show this only if…" rule, pre-fill, auto-calculation and validation — against our product as built on 16-Aug (build 9b45d722), with code references and real screenshots. ${md(D.meta.headline)}</p>
<div class="tally">${['COVERED','KNOWN','PARTIAL','MISSING','DIVERGENT','UNCLEAR'].map(k=>`<div class="t">${vchip(k)}<b>${T[k]||0}</b></div>`).join('')}<div class="t"><span class="chip">TOTAL</span><b>${D.rows.length}</b></div></div>
<p class="small muted">COVERED = matches the guide · KNOWN = already ruled by you, out of V1 scope (e.g. Tax Groups = Phase 2), or the portal itself differs from the guide · PARTIAL = present but a stated rule differs · MISSING = no trace · DIVERGENT = deliberately different · UNCLEAR = guide and portal disagree.</p>
<h3>What we need from you — 13 decisions, ~30 minutes</h3><p>Use the left index. Each decision is one screen with the same structure: <b>Background → what the FTA guide says → what EmaraTax shows → what our product does (with screenshots) → why it matters → the question</b>. Pick an option, add a line if you like, click <b>Save answer</b>. Your answers go straight to us; the progress bar on the left tracks what is done. Nothing is built until you have answered and Mayuresh confirms.</p>
<h3>Two things to keep in mind</h3><ul class="small">${D.caveats.map(c=>`<li>${md(c)}</li>`).join('')}</ul>
<div class="banner">Nothing in this audit has been actioned. Findings become rulings or build items only after your review.</div>
<div class="pager"><span></span><button class="btn" onclick="go('decision-1')">Start with Decision 1 →</button></div></div></section>`;
  D.decisions.forEach((d,i)=>v+=decisionView(d,i));
  v+=`<section class="view" id="v-strong"><h2>What's confirmed solid</h2><div class="card"><ul>${D.strengths.map(s=>`<li>${md(s)}</li>`).join('')}</ul></div><div class="pager"><button class="btn sec" onclick="go('decision-${D.decisions.length}')">← Last decision</button><button class="btn sec" onclick="go('findings')">All findings →</button></div></section>`;
  v+=`<section class="view" id="v-findings"><h2>All findings (reference)</h2><p class="small muted">Every difference pattern, including the ones already ruled by you or out of scope. Each opens with a plain-English summary; the internal detail (rulings, code, dedup) is folded below it.</p>${D.findings.map(f=>{const rws=D.rows.filter(r=>r.f===f.id);const vs={};rws.forEach(r=>vs[r.v]=(vs[r.v]||0)+1);const evs=[...new Set(rws.flatMap(r=>r.ev))].slice(0,8);return `<details class="f" id="${f.id}"><summary><span class="id">${f.id}</span><span class="t">${esc(f.title)}</span></summary><div class="body"><p class="small">${md(f.verdict_line)}</p>${f.plain?`<p><b>In plain terms:</b> ${esc(f.plain)}</p>`:''}${thumbs(evs)}<details><summary class="small muted" style="cursor:pointer">Detail & references (internal)</summary>${md(f.body)}${rws.length?`<p class="small muted">Rows: ${Object.entries(vs).map(([k,n])=>vchip(k)+' '+n).join(' ')} — <a href="#register" onclick="go('register');setFilter('${f.id}');return false;">show in register</a></p>`:''}</details>${callbox(f.id,'Comment on '+f.id,null)}</div></details>`;}).join('')}</section>`;
  v+=`<section class="view" id="v-register"><h2>Full register (reference)</h2><div class="filters"><select id="f-sec"><option value="">All sections</option>${Object.entries(D.secnames).filter(([k])=>D.rows.some(r=>r.sec==k)).map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('')}</select><select id="f-v"><option value="">All verdicts</option>${['COVERED','KNOWN','PARTIAL','MISSING','DIVERGENT','UNCLEAR'].map(x=>`<option>${x}</option>`).join('')}</select><select id="f-fid"><option value="">All findings</option>${[...new Set(D.rows.map(r=>r.f))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="f-q" type="search" placeholder="Search…"><span class="small muted" id="rcount"></span></div><div class="tblwrap"><table class="reg"><thead><tr><th>Ref</th><th>Requirement (guide)</th><th>Verdict</th><th>Finding</th><th>Evidence</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>`;
  v+=`<section class="view" id="v-sources"><h2>Sources & method</h2><div class="card small"><p><b>Primaries:</b> ${esc(D.meta.guide)} (176 pp, read end-to-end) and ${esc(D.meta.manual)} (162 pp, read end-to-end). All 16 FTA guides hyperlinked from the Returns guide were fetched and consulted where a finding turned on them.</p><p><b>Method:</b> guide → 515-row logic inventory (visibility gate, pre-population, auto-calc, validation, routing per field) → each row traced to code (file:line at build ${esc(D.meta.build)}) → real-stack screenshots (fresh database, no injected data) → checked against your existing rulings/UAT log/open questions → adjudicated into pattern findings → the 13 decisions on this page.</p><table class="reg"><thead><tr><th>#</th><th>Document</th><th>Referenced from</th><th>In our possession</th></tr></thead><tbody>${D.linked.map(l=>`<tr><td>${l.n}</td><td>${md(l.doc)}</td><td>${esc(l.refs)}</td><td>${md(l.have)}</td></tr>`).join('')}</tbody></table></div></section>`;
  $('#views').innerHTML=v;
  ['f-sec','f-v','f-fid','f-q'].forEach(id=>$('#'+id).addEventListener('input',renderRows)); renderRows(); wire(); status(); remoteFetch().then(()=>{syncPending().then(()=>{remoteFetch().then(()=>{$$('.callbox').forEach(b=>renderC(b.dataset.anchor,$('.clist',b)));markDone();});});}); markDone();
  go((location.hash||'#start').slice(1));
}
window.setFilter=function(f){$('#f-fid').value=f;$('#f-sec').value='';$('#f-v').value='';renderRows();};
function renderRows(){const sec=$('#f-sec').value,v=$('#f-v').value,f=$('#f-fid').value,q=$('#f-q').value.trim().toLowerCase();const rs=D.rows.filter(r=>(!sec||r.sec==sec)&&(!v||r.v===v)&&(!f||r.f===f)&&(!q||(r.ref+' '+r.req+' '+r.notes+' '+r.loc).toLowerCase().includes(q)));$('#rcount').textContent=`${rs.length} of ${D.rows.length} rows`;window.__rows=rs; $('#rows').innerHTML=rs.slice(0,600).map((r,i)=>`<tr class="main" data-i="${i}" onclick="openRow(${i})"><td><b>${esc(r.ref)}</b></td><td>${esc(r.req)}</td><td>${vchip(r.v)}</td><td>${r.f&&r.f!=='—'?esc(r.f):'—'}</td><td class="evl">${r.ev.length?`📷 ${r.ev.length}`:'<span class="muted small">—</span>'}</td><td><button class="btn sec" style="padding:2px 8px;font-size:12px">open →</button></td></tr>`).join('');}
window.closeRp=function(){$('#rp').classList.remove('on');$$('table.reg tr.sel').forEach(t=>t.classList.remove('sel'));};
window.openRow=function(i){ const r=window.__rows[i]; if(!r) return; $$('table.reg tr.sel').forEach(t=>t.classList.remove('sel')); const tr=$(`table.reg tr[data-i="${i}"]`); tr&&tr.classList.add('sel'); const f=r.f&&r.f!=='—'?D.findings.find(x=>x.id===r.f):null; const g=r.g; const secn=D.secnames[r.sec]||''; 
 const guideBlock = g? `<div class="val guide"><p><b>${esc(g.field)}</b> <span class="small muted">(${esc(g.type)}${g.page?` · guide p.${esc(g.page)}`:''})</span></p><p><b>Shown when:</b> ${md(g.vis)}</p>${g.prepop&&g.prepop!=='none'&&g.prepop!=='—'?`<p><b>Pre-filled from:</b> ${md(g.prepop)}</p>`:''}${g.calc&&g.calc!=='none'&&g.calc!=='—'?`<p><b>Computes / validates:</b> ${md(g.calc)}</p>`:''}${g.feeds&&g.feeds!=='none'&&g.feeds!=='—'?`<p><b>Feeds / routes to:</b> ${md(g.feeds)}</p>`:''}</div>` : `<div class="val guide">${md(r.req)}</div>`;
 $('#rp-body').innerHTML = `<div class="small muted">${esc(secn)} · guide field <b>${esc(r.ref)}</b></div><h2>${esc(r.req)}</h2><p>${vchip(r.v)} ${f?`<span class="small">· part of <a href="#" onclick="go('findings');setTimeout(()=>{const e=document.getElementById('${f.id}');if(e){e.open=true;e.scrollIntoView();}},50);closeRp();return false;">${f.id} — ${esc(f.title)}</a></span>`:''}</p>
 <div class="blk"><div class="k">What the FTA guide requires <span>field logic as extracted</span></div>${guideBlock}
 ${f&&D.plain[f.id]?`<div class="k">Why this verdict <span>the pattern it belongs to</span></div><div class="val why">${esc(D.plain[f.id])}</div>`:''}
 <div class="k">What our product does <span>build 9b45d722</span></div><div class="val product">${r.does?md(r.does):''}${r.loc&&r.loc!=='none found'?`<p class="small"><b>Where in the code:</b> ${md(r.loc)}</p>`:''}${r.notes?`<p class="small"><b>Auditor notes:</b> ${md(r.notes)}</p>`:''}</div>
 ${r.dedup&&r.dedup!=='—'&&r.dedup!=='none'?`<div class="k">Already ruled / logged</div><div class="val">${md(r.dedup)}</div>`:''}
 ${r.ev.length?`<div class="k">Evidence <span>real-stack screenshots</span></div><div class="val">${thumbs(r.ev.slice(0,8))}</div>`:''}
 </div>${callbox('row-'+r.ref,'Comment on this row',null)}`;
 wire(); $('#rp').classList.add('on'); $('#rp').scrollTop=0; };
window.tog=function(b){const tr=b.closest('tr').nextElementSibling;tr.style.display=tr.style.display==='none'?'':'none';};
window.lb=function(e){$('#lb img').src='img/'+e.replace(/\.png$/,'.jpg');$('#lb .cap').textContent=(D.captions[e]||e);$('#lb').classList.add('on');return false;};
window.go=function(id){ if(!$('#v-'+id)) id='start'; if(id!=='register') closeRp(); $$('.view').forEach(x=>x.classList.remove('on')); $('#v-'+id).classList.add('on'); $$('aside a.nav').forEach(a=>a.classList.toggle('on',a.dataset.view===id)); if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); window.scrollTo(0,0); const a=$(`aside a.nav.on`); a&&a.scrollIntoView({block:'nearest'}); };
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('DOMContentLoaded',()=>{render();$('#lb .x').addEventListener('click',()=>$('#lb').classList.remove('on'));$('#lb').addEventListener('click',ev=>{if(ev.target.id==='lb')$('#lb').classList.remove('on');});$$('aside a.nav').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();go(a.dataset.view);}));});
</script></body></html>
