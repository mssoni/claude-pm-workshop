<script>window.FTA_DATA={"meta": {"date": "2026-08-16", "build": "origin/main 9b45d722", "guide": "FTA Corporate Tax Guide — Tax Returns (CTGTXR1), 11-Nov-2024", "manual": "EmaraTax Taxpayer User Manual — Corporate Tax Return v4.0, 17-Sep-2024", "headline": "The product **matches the guide's structure well**: 267 rows COVERED outright, 114 KNOWN (mostly the Tax-Group persona = Phase 2, items you have already ruled, and portal-faithful shapes such as the declaration block and the Free-Zone confirmation tick-boxes), 81 PARTIAL, 38 MISSING, 7 DIVERGENT, 3 UNCLEAR (guide and portal disagree). The gaps cluster into a small number of **patterns**, not scattered defects — and most are **gating rules the guide states that the product does not enforce**, exactly the class this audit was asked to find.", "tally": {"KNOWN": 114, "PARTIAL": 81, "COVERED": 267, "MISSING": 38, "DIVERGENT": 7, "UNCLEAR": 3, "n/a": 1}}, "decisions": [{"n": 1, "finding": "FTA-011", "title": "Qualifying-IP schedule: cumulative or per-period expenditure?", "area": "Free Zone · IP", "impact": "HIGH (from year 2)", "background": "A Qualifying Free Zone Person that owns patents/software earns 0% only on the 'nexus' share of its IP income. The share is a ratio: (Qualifying R&D spend + 30% uplift) ÷ Overall R&D spend, applied to the IP income of the period. Our S050 schedule computes this ratio correctly — it reproduces the FTA's own worked examples (uplift 9,000; qualifying income 156,000; excess 244,000).", "guide": "The FTA Free Zone Persons guide (§9.5, p.72–73) says the two expenditure figures are CUMULATIVE over the life of the IP asset: 'the calculation requires that Qualifying Expenditures include all Qualifying Expenditures incurred by the taxpayer over the life of the asset … these numbers will therefore increase every time a taxpayer incurs expenditure … the proportion of the cumulative numbers will then determine the percentage to be applied to Overall Income earned each Tax Period.' The Returns guide (Sch 12.2, p.106–107) describes the same fields without stating the period.", "portal": "The portal's IP schedule fields are 'Overall Income', 'Overall Expenditure', 'Qualifying Expenditure' per IP asset (Returns guide 12.2.2–12.2.4); the screen does not say whether the expenditure boxes are life-to-date or this year only.", "product": "Our S050 schedule captures the two expenditure figures as typed for the current period only; nothing is carried forward from last year's schedule. The delivered S050 sheet we built from also reads as period figures.", "why": "If the figures should be life-to-date, then from year 2 onward our ratio will be wrong for any client whose R&D spend pattern changes (e.g. heavy development in year 1, little in year 2 would collapse the qualifying share). It does not affect year-1 returns.", "question": "Should the S050 'Qualifying Expenditure' and 'Overall Expenditure' be entered as LIFE-TO-DATE cumulative figures per IP asset (with the product carrying last year's balances forward), or as current-period figures only, as the delivered sheet reads?", "options": ["Cumulative life-to-date (product carries balances forward from year 2)", "Current period only (as the sheet reads today)", "Discuss"], "evidence": ["fz/16a-fz-IP-102-modal-Ex41-inputs.png", "fz/16b-fz-IP-102-row-committed-nexus.png", "fz/16c-fz-IP-102-schedule-full.png"]}, {"n": 2, "finding": "FTA-013", "title": "Interest capping: inputs that never reach the engine", "area": "Interest deduction (Art 30)", "impact": "HIGH", "background": "Net Interest Expenditure above the higher of AED 12m or 30% of adjusted EBITDA is disallowed and carried forward 10 years. Our interest-cap engine applies that rule correctly.", "guide": "Returns guide §9.2 (p.79–81) and Sch 19 (p.138–146): the Interest Capping schedule takes total interest EXPENDITURE and total interest INCOME subject to the rule, the disallowed amount BROUGHT FORWARD from prior years (pre-populated), adjusted EBITDA, and computes the limit, the deductible amount, the disallowed amount, and how much brought-forward is used this year (oldest first). Banks, insurers and natural persons are outside the rule.", "portal": "The EmaraTax popup (User Manual p.84–87) shows exactly those inputs: total interest expenditure, total interest income, non-deductible NIE brought forward (auto), adjustments, EBITDA (typed), then the auto limit/deductible/non-deductible lines; the block is preceded by 'Is the Taxable Person a Bank or an Insurance Provider?'.", "product": "Three of those inputs exist on our screens or ledger but do NOT reach the calculation: (1) brought-forward disallowed interest is displayed in the ledger but the engine computes with zero; (2) interest INCOME has no field at all, so 'net' interest = gross interest expenditure; (3) expired 10-year tranches are computed but not fed. Also the Bank/Insurer/natural-person exemption cannot be switched from the wizard, and the 12m de-minimis test keys on the 12m limb only.", "why": "For a client with meaningful interest income or a prior-year disallowed balance, the disallowed figure — and therefore Taxable Income — comes out wrong. This is money, not presentation.", "question": "Do you agree we should (a) add an interest-income field, (b) feed brought-forward and expired tranches into the engine, and (c) add the Bank/Insurer/natural-person applicability question — as one package under your open Q18?", "options": ["Yes — all three under Q18", "Only some (say which in the comment)", "Discuss"], "evidence": ["nonfz/42-sectionF-F8-interest-yes.png", "nonfz/43-sectionF-F9-bf-nie-yes.png"]}, {"n": 3, "finding": "FTA-019", "title": "Foreign PE schedule: the loss-offset test is missing", "area": "Foreign Permanent Establishment (Art 24)", "impact": "MEDIUM-HIGH", "background": "A Resident may elect to exempt the income and expenses of its foreign branches (Foreign PEs) if they are taxed abroad at ≥9%. There is a catch: if in earlier years the entity used FPE LOSSES against UAE income, it cannot exempt FPE PROFITS until those losses have been recaptured.", "guide": "Sch 14 (p.110–112): for prior periods the schedule asks 14.1.5 'FPE tax losses utilised against Taxable Income' and 14.1.6 'FPE losses offset against subsequent FPE Taxable Income'; rule: 'if 14.1.6 > 14.1.5 the exemption will NOT be available in the current Tax Period' (MD 116 Art 13(1)); 14.1.7 carried-forward is auto = 14.1.5 − 14.1.6.", "portal": "The Foreign PE income lines are on the Accounting Adjustments screen (User Manual p.70–71); the prior-period recapture detail sits in the schedule described by the guide.", "product": "Our FPE schedules (#104 prior periods, #105 current, #106 ineligible) hold prior-period income/loss/utilised columns, but there is no 'offset against subsequent FPE income' field, no 'exemption not available' test and no auto carry-forward. Prior rows are typed/uploaded rather than pre-populated. Separately, the FPE result is not yet wired into the computation (your open Q24).", "why": "A client that used FPE losses in year 1 could wrongly claim the exemption in year 2. Year-1 returns are unaffected unless the client had pre-CT FPE losses.", "question": "Should we add the 14.1.6 field, the 'exemption unavailable if 14.1.6 > 14.1.5' check and the auto carry-forward to the FPE schedule (and close Q24 on wiring the result to the computation at the same time)?", "options": ["Yes — add fields + test + carry-forward", "Not for V1 (year-2 item)", "Discuss"], "evidence": ["nonfz/21-sectionB-fpe-has-yes.png", "nonfz/22-sectionB-fpe-election-yes.png"]}, {"n": 4, "finding": "FTA-021", "title": "Reliefs (QG transfers / BRR): 6 fields where the return has 14; QG gain not fed to computation", "area": "Reliefs (Art 26 / Art 27)", "impact": "MEDIUM-HIGH", "background": "Transfers within a Qualifying Group and Business Restructuring Relief let gains/losses be deferred. The return then asks the transferor and the transferee a series of adjustment questions, including clawbacks within two years.", "guide": "§8.1 and §8.2 (p.68–76) each list 14 items: 'need adjustments?', 'clawback adjustments?', 'received assets/business as transferee?', gains/losses subject to relief, gains/losses on clawback, excluded unrealised gains/losses, gains/losses not previously recognised now realised, depreciation adjustments up/down, other clawback adjustments up/down, and a description. The first question is shown only if the election was made in the Elections section.", "portal": "The Reliefs screen (User Manual p.73–78) renders all 14 rows for QG and all 14 for BRR inline.", "product": "Our Section E has 6 fields for each relief (the gate question, received-as-transferee question, gains/losses subject to relief and on clawback). The clawback yes/no, 'now realised' pair, 'other clawback' pair and description have no equivalent — this comes from the V2 E-sheet we were given. The two gate questions show even when the election was not made. And the QG current-period gain/loss is captured on the schedule but NOT fed into the computation, while the equivalent BRR figure IS fed (your open Q16).", "why": "For any client using these reliefs the return cannot be keyed field-for-field, and a QG transferor's gain would be missing from Taxable Income.", "question": "(a) Should Section E carry the full 14-row shape for both reliefs? (b) Confirm the QG current-period gain/loss should feed the computation like BRR (Q16). (c) Should the two gate questions be hidden unless the election was made?", "options": ["Yes to (a)(b)(c)", "Only (b) — the money one", "Discuss"], "evidence": ["nonfz/39-sectionDE-E-qg-brr-adjust.png", "nonfz/19-sectionB-qg-yes.png", "nonfz/20-sectionB-brr-yes.png"]}, {"n": 5, "finding": "FTA-001", "title": "Cash-basis answer should switch things off — it currently does nothing", "area": "Elections / adjustments gating", "impact": "MEDIUM", "background": "Small taxpayers (revenue ≤ AED 3m) may prepare accounts on the cash basis. Several return sections only make sense under accrual accounting.", "guide": "If financial statements are on the CASH basis (4.1.4/4.2.7): the realisation-basis election (5.1.1) and the three transitional elections (5.2.1–5.2.3) are NOT visible; the 'income/losses not in the income statement' questions (§7.4) are not visible; 'held qualifying assets?' (7.6.1) is pre-populated 'No' and the rest of §7.6 not asked; the Accounting Schedule reduces to the Income Statement only (6.1).", "portal": "Taxpayer Details shows the cash/accrual radio (User Manual p.19–20); downstream sections are 'determined based on the Revenue specified or the Persona' (p.14).", "product": "We ask cash/accrual in Section A but nothing downstream reads the answer — the elections, the D4/D7 questions and all Accounting-Schedule parts render regardless.", "why": "A cash-basis client can be led into elections and adjustments that do not apply to it. Low frequency in your client base, but the guide is explicit.", "question": "Should the cash-basis answer hide the realisation/transitional elections, §7.4 and §7.6, and reduce the Accounting Schedule to the Income Statement, as the guide describes?", "options": ["Yes — implement the cash-basis gate", "No — leave as is (preparer judgement)", "Discuss"], "evidence": ["nonfz/05-sectionA-Q4cash.png", "nonfz/14-sectionB-default-sbr.png"]}, {"n": 6, "finding": "FTA-023", "title": "Tax losses: QFZP loss split, and the open formula items", "area": "Tax losses (Art 37–39)", "impact": "HIGH (QFZP) / open items", "background": "Losses carry forward and can offset up to 75% of Taxable Income; they can also be transferred within a group. Our engine applies the 75% cap correctly.", "guide": "Sch 17.1.2 (p.121): 'Tax Loss incurred in the current period' is pre-populated from the computation, BUT 'if you are a QFZP, Tax Losses attributable to Qualifying Activities are NOT included' — only losses of the 9% side carry forward. Also 17.1.10 'losses carried forward available for transfer' is auto, and 17.3.1/17.3.4 cap transfers at that balance and at 75% of the recipient's income.", "portal": "The Tax Losses popup (User Manual p.117–127) shows the greyed auto rows and the 'Amount of Tax Losses Available for Transfer' auto field.", "product": "(1) No split of a QFZP's loss between qualifying and non-qualifying activities — the whole loss goes to the ledger. (2) The 'available for transfer' formula is still undelivered (Q19) and the transfer banner uses Taxable-Income-before-relief as a stand-in (Q20). (3) Own-losses-first and the recipient's 75% cap are not validated on transfers.", "why": "(1) is a real error for a loss-making QFZP; (2)/(3) are already on your list (Q19/Q20).", "question": "Confirm: for a QFZP, only the loss attributable to non-qualifying (9%) income should enter the loss ledger — should we split it (using the 0%/9% columns already on the FZ return)? And please close Q19/Q20 with the formulas.", "options": ["Yes — split the QFZP loss; formulas per Q19/Q20", "No — carry the whole loss", "Discuss"], "evidence": ["fz/28-fz-3column-0pct-9pct-total-grid.png", "fz/31-fz-tax-liability-credits-step.png"]}, {"n": 7, "finding": "FTA-012", "title": "Participation Exemption: block or warn? and the <5% / <AED 4m warning", "area": "Exempt income (Art 23)", "impact": "MEDIUM", "background": "Dividends and gains from a ≥5% (or ≥AED 4m cost) holding held 12 months in a company taxed ≥9% are exempt. Our PE schedule captures each participation; the exempt TOTAL is a manual placeholder by our earlier agreement (OW-25).", "guide": "Sch 18 (p.133–137): 18.10 acquisition cost is asked only if ownership <5%, and the portal shows a WARNING when <5% AND cost <AED 4m ('PE not available'); 18.13 (intend to hold 12 months) and 18.14 (all other conditions met) also show a WARNING when answered No — the row is not blocked.", "portal": "The User Manual (Sep-2024) shows the participation rows on the Accounting Adjustments screen (p.69–70); the popup detail follows the guide.", "product": "We always capture acquisition cost, with no <5%/<4m warning. On 18.13/18.14 we HARD-BLOCK a 'No' row (from your capture 15, RULING 123 addendum: 'YES-ONLY on Add'), where the guide says the portal only warns.", "why": "Blocking is stricter than the portal — a preparer cannot record a non-qualifying participation on the schedule at all; the missing warning means an under-5%, under-4m holding can be entered as if exempt.", "question": "(a) Keep the hard block on 18.13/18.14 = No, or switch to a warning as the guide describes? (b) Add the '<5% and <AED 4m ⇒ PE not available' warning?", "options": ["Warn (match the guide) + add the <5%/<4m warning", "Keep the block + add the warning", "Discuss"], "evidence": ["fz/34-fz-participation-exemption-12-surface.png", "fz/35-fz-participation-country-UAE-18.4-forced-yes.png", "nonfz/38-sectionDE-D10-participation-pe.png"]}, {"n": 8, "finding": "FTA-007", "title": "Small Business Relief eligibility: two conditions missing; hide vs disable", "area": "Elections · SBR", "impact": "MEDIUM", "background": "SBR lets a Resident with revenue ≤ AED 3m skip the tax computation. Our gate checks revenue this year, MNE membership and QFZP status, and disables the election with a reason when ineligible.", "guide": "§5.3 (p.49): the SBR fields do NOT appear unless the person is a Resident, not a QFZP, not an MNE member, and revenue ≤ AED 3m in the current AND ALL PREVIOUS Tax Periods (MD 73/2023). Guide: 'this section will not be visible if the requirements are not met'.", "portal": "User Manual p.38: revenue is greyed-in and 'If you are entitled … answer Yes/No to the MNE question' — the section is present for an eligible filer.", "product": "Two conditions are not checked: Resident status, and revenue ≤ 3m in all previous periods (the latter belongs to the year-2 work you parked). Ineligible ⇒ we DISABLE with a reason; guide ⇒ HIDE.", "why": "A non-resident or a client that exceeded 3m last year could be offered SBR. Rare in year 1, real from year 2.", "question": "Add the Resident condition now, and the 'all previous periods' condition with the year-2 work? Keep disable-with-reason (our choice, more informative) or hide (guide)?", "options": ["Add both conditions; keep disable-with-reason", "Add both conditions; hide like the guide", "Discuss"], "evidence": ["nonfz/14-sectionB-default-sbr.png", "nonfz/23-sectionB-sbr-ineligible-mne.png"]}, {"n": 9, "finding": "FTA-004", "title": "Residency questions: the foreign-incorporated (POEM) branch is not modelled", "area": "Taxpayer details", "impact": "MEDIUM (persona-dependent)", "background": "The return first establishes whether the filer is a Resident or Non-Resident. UAE-incorporated companies are Resident unless a tax treaty says otherwise; FOREIGN-incorporated companies are Resident only if effectively managed and controlled in the UAE.", "guide": "§4.2.12–4.2.20 (p.36–38) is a two-armed tree: incorporated in UAE/Free Zone? → Yes: DTA-resident elsewhere? → country → Non-Resident with UAE nexus/PE? (No ⇒ straight to declaration); → No: 'effectively managed and controlled in the UAE?' (POEM) → DTA question → country of incorporation → basis for filing.", "portal": "The Taxpayer Details screen (User Manual p.19–21) shows the UAE-incorporated arm (incorporated? greyed Yes; DTA resident? Yes/No) for the sample entity.", "product": "Our questions are a flat line: incorporated in UAE? (no branching) → DTA-resident? → Non-Resident? → PE and/or nexus checkboxes; the DTA out-of-scope short return (4.2.15 = No) IS implemented. There is no POEM question and no country-of-incorporation for the foreign-incorporated arm.", "why": "Only matters if you prepare returns for foreign-incorporated entities managed from the UAE (or foreign companies with a UAE PE). If none, this is a non-issue.", "question": "Do your clients include foreign-incorporated entities (managed from the UAE, or with a UAE PE)? If yes, should we build the POEM branch; if no, we mark this out of scope.", "options": ["Yes — build the POEM branch", "No such clients — out of scope", "Discuss"], "evidence": ["nonfz/08-sectionA-Q7no-noroute.png", "nonfz/09-sectionA-Q8yes-dta-nr.png", "nonfz/10-sectionA-Q8b-yes-pe-nexus.png", "nonfz/11-sectionA-Q8b-no-dta-shortreturn.png"]}, {"n": 10, "finding": "FTA-009", "title": "Free Zone confirmations and two field shapes", "area": "Free Zone schedule", "impact": "MEDIUM", "background": "The Free Zone schedule ends with six confirmations (adequate assets, employees, opex in the FZ; arm's length; TP documentation; audited FS). Our block matches the portal: six tick-boxes.", "guide": "12.1.33–12.1.38 (p.104–105): 'If the answer to ANY of the questions is No, the Free Zone Person cannot be a QFZP for the current and the subsequent four Tax Periods.' Also 12.1.21/12.1.22 (both employee counts) are listed as always visible, and 12.1.18 'Qualifying Activities undertaken' is a list of activities.", "portal": "User Manual p.31: six checkboxes under 'I confirm that…'; p.30: BOTH employee-count fields shown side by side; p.29: 'Qualifying Activities undertaken' is a multi-select dropdown.", "product": "Tick-boxes as in the portal — but an un-ticked box has no consequence (the return still claims 0%). We reveal only one of the two employee-count fields depending on 'all employees in FZ?'; and 'Qualifying Activities' is a free-text box.", "why": "A preparer could file a QFZP return with a confirmation un-ticked; the other two are shape differences that make keying into EmaraTax slightly different from our screen.", "question": "(a) Should an un-ticked confirmation block the 0% treatment for the current period (the 5-year tail is year-2 work)? (b) Show both employee-count fields always? (c) Make Qualifying Activities a multi-select list?", "options": ["Yes to (a)(b)(c)", "Only (b)(c) — keep confirmations advisory", "Discuss"], "evidence": ["fz/25-fz-confirmations-checkboxes.png", "fz/21-fz-12.1.20-yes-reveals-12.1.21-total-employees.png", "fz/22-fz-12.1.20-no-reveals-12.1.22-employees-in-fz.png", "fz/17-fz-12.1.17-amount-reveals-12.1.18-activities.png"]}, {"n": 11, "finding": "FTA-015", "title": "Section F amounts that are captured but not computed", "area": "Other adjustments → computation", "impact": "MEDIUM", "background": "Section F ('Other adjustments') has several amounts that the return treats as adjustments to Taxable Income. Ours captures them (they are required fields) but they do not flow into the tax computation, which only has generic 'other non-deductible' and 'ministerial-decision adjustment' lines.", "guide": "9.2.6 (SIDLR non-deductible interest, Art 31), 9.3.6/9.3.7 (gains/losses on assets received from related parties at non-arm's-length), 9.4.2–9.4.6 (share of QIF income/expenditure and distributions), 9.5.6/9.5.7 (other adjustments increasing/decreasing) — all described as adjustments that change Taxable Income (p.81–88).", "portal": "User Manual p.87 (SIDLR row), p.109 (RP realised gains/losses), p.110 (QIF), p.111 (other adjustments) — typed amounts on the Other Adjustments screen; Taxable Income is then auto-calculated (p.114).", "product": "Fields present and required; marked 'capture-only — fed to no computation this wave' in the build. The preparer must re-key them into the computation's generic lines, and the return and computation can disagree.", "why": "Double-keying risk on every return that uses these lines; a missed re-key changes tax payable.", "question": "Should these Section-F amounts feed the computation automatically (each to a specific line), or is double-keying the intended control for now?", "options": ["Feed automatically", "Keep manual for V1", "Discuss"], "evidence": ["nonfz/46-sectionF-F12d-rpt-prevgl.png", "nonfz/49-sectionF-F14-qif-yes.png", "nonfz/51-sectionF-F16-other-yes.png"]}, {"n": 12, "finding": "FTA-014", "title": "Transfer pricing: one un-ruled gate and one three-way tension", "area": "Related parties / connected persons", "impact": "MEDIUM · your emphasis", "background": "Thresholds (AED 40m aggregate, 4m per category, 500k per connected person), transaction types and TP methods all match the guide. Two of your earlier rulings are honoured: the signed two-way related-party adjustment (and the portal's own popup computes the same direction as we do) and the connected-person adjustment floored at zero.", "guide": "9.3.4 (p.83): 'Any transfer pricing adjustment that DECREASES Taxable Income will be allowed only upon a successful application to the FTA — enter the aggregate value of such downward adjustments which have been approved.' 9.3.3/9.3.10: the additions and CP adjustments are entered manually and 'should be equal or more than the adjustment reported in the Schedule'.", "portal": "User Manual p.102: 'Additions as a result of adjustments … not at arm's length' is AUTO-calculated (greyed) from the RPT schedule.", "product": "Downward TP adjustments can be entered freely — no confirmation that the FTA approved them. Additions are keyed manually and the schedule total is context-only (your RULING 124), so no ≥-schedule check.", "why": "A downward adjustment without FTA approval is a compliance risk on the return itself; the additions question is a three-way disagreement between guide, portal and our ruling worth one explicit decision.", "question": "(a) Should the product require an 'FTA approval obtained' confirmation before accepting a downward TP adjustment? (b) Additions from RP transactions: auto-fill from the schedule (portal), manual with a ≥-schedule check (guide), or manual as ruled (RULING 124)?", "options": ["(a) Yes; (b) auto-fill from schedule", "(a) Yes; (b) keep manual (RULING 124)", "Discuss"], "evidence": ["nonfz/44-sectionF-F12-rpt-yes.png", "nonfz/45-sectionF-F12a-40m-rpt-schedule.png", "nonfz/48-sectionF-F13a-500k-cp-schedule.png"]}, {"n": 13, "finding": null, "title": "Smaller items — please tick any you want built", "area": "Various", "impact": "LOW–MEDIUM", "background": "Items that are real differences from the guide but small in impact or frequency. Each is one line; tick the ones you want and we will treat the rest as accepted divergences.", "guide": "See the finding cards for the page references (FTA-016, FTA-026, FTA-024, FTA-022, FTA-002, FTA-025, FTA-029, FTA-027).", "portal": "Where the portal differs from the guide we have NOT counted the item against the product (e.g. the 'other adjustments' description, the 'brought-forward losses?' question, the second depreciation row, the declaration shape).", "product": "Missing or partial in our build: (1) natural-person 'amounts withdrawn from the business' line (9.1.6); (2) deferred-gains/losses schedule (22.3) — its two amounts exist as manual fields; (3) 'evidence of foreign tax paid' attachment slot (22.4.4); (4) FS attachment is advisory and has no SBR carve-out (22.4.1); (5) per-country foreign-tax-credit cap — global only (15.1.6/7, Q22); (6) 'use tax credits?' not hidden when there is a Tax Loss (10.4.3); (7) first-period hides for 7.5.4–7.5.6 and 9.5.1; (8) liability rows can be marked PE-exempt (21.5.4 should be locked to No); (9) OCI-schedule fields visible-optional instead of hidden (22.1.4–7); (10) 'audited FS' not pre-set Yes for revenue > AED 50m (6.2.1); (11) donations not validated against the Accounting Schedule (9.1.3); (12) Government/Extractive entities can still access QG/BRR/loss transfer (23.1.3).", "why": "Individually small; together they are the difference between 'matches the guide' and 'mostly matches'.", "question": "Which of (1)–(12) do you want built? List the numbers in the comment; anything not listed we record as accepted.", "options": ["Build the ones I list", "None — accept all as-is", "Discuss"], "evidence": ["nonfz/41-sectionF-nde-row.png", "nonfz/52-review-default.png", "nonfz/55-review-verification-checks.png"]}], "sections": [["start", "Start here", "What this is, how it was done, the headline numbers, and how to use this page (5 minutes)."], ["decisions", "Decisions (13)", "One screen per decision. Each has the same shape: background · what the FTA guide says · what EmaraTax shows · what our product does · why it matters · the question · your call. Answer in place."], ["strong", "What's confirmed solid", "Areas verified as matching the FTA guide, with the FTA worked examples we reproduced — so the picture is balanced."], ["findings", "All findings (30)", "Reference: every difference pattern we found, including the ones already ruled by you or out of V1 scope. Open only if you want the detail behind a decision."], ["register", "Full register (511 rows)", "Reference: every field of the FTA guide with our verdict, code location and screenshot. Filterable. You do not need to read this."], ["sources", "Sources & method", "The documents used (FTA guide, EmaraTax user manual, the 16 linked FTA guides) and how the audit was run."]], "findings": [{"id": "FTA-001", "title": "Cash-basis answer does not gate anything downstream", "verdict_line": "**MISSING (gate) · MEDIUM**", "body": "Guide: if FS are on the **Cash Basis** (4.1.4/4.2.7/4.4.5/4.5.5) then 5.1.1 realisation election and 5.2.1–5.2.3 transitional elections are **not visible**; §7.4 fields not visible; 7.6.1 pre-populated 'No' and rest of §7.6 not asked; Accounting Schedule = Income Statement only (6.1).\nBuild: `a_q4_cash_accrual` exists (section-a.ts:177) but no consumer — no `q4`/cash reference in section-b*.ts, section-de.ts, section-c.ts; elections, D4/D7 and all Section-C parts render regardless.\nInstances: 5.1.1, 5.2.1, 5.2.2, 5.2.3, 7.4.1, 7.6.1, 6.1-cash (MISSING gate); 4.1.4/4.2.7/4.4.5/4.5.5 (PARTIAL). Dedup: none (RULING 60 grey-lock is once-only, not cash). Fix shape: one gate keyed on Q4 (pattern-first).", "plain": "The guide hides the realisation-basis and transitional elections, the OCI questions and the transitional adjustments when the financial statements are on the CASH basis (and reduces the Accounting Schedule to the Income Statement). Our product asks cash/accrual but does not use the answer anywhere downstream. Ask: should we add this gate?"}, {"id": "FTA-002", "title": "\"Not visible in the first Tax Period\" rules not applied to §7.5.4–7.5.6 and 9.5.1", "verdict_line": "**PARTIAL · MEDIUM-LOW**", "body": "Guide hides 7.5.4–7.5.6 (prior-period unrealised now realised) and 9.5.1 (prior-period error ≤10k) in the first Tax Period return; nils 19.2.3/19.3.1 in Y1. Build has the first-portal-year concept (grey-lock, RULING 60; FPE #104 grey RULING 102 = COVERED) but D6/D6a/D6b and F15 render flat (`ReturnScreen.tsx:2360` \"ship regardless of the first-year flag\"). Instances: 7.5.4, 7.5.5, 7.5.6, 9.5.1. Dedup: none.", "plain": "The guide hides 'prior-period unrealised gains now realised' (7.5.4–7.5.6) and 'prior-period error ≤ AED 10k' (9.5.1) in the FIRST Tax Period return. Our product shows them in year 1 too (it does hide the Foreign-PE prior-period block correctly). Ask: apply the first-period hide to these too?"}, {"id": "FTA-003", "title": "§7.5 realisation-basis adjustments not gated on the §5.1 election; description row absent", "verdict_line": "**PARTIAL / MISSING · MEDIUM** (portal: ONE depreciation row like the build ⇒ 7.5.7 downgraded to UNCLEAR; portal HAS the description row ⇒ 7.5.11 MISSING stands)", "body": "Guide: all §7.5 visible only if realisation basis elected; two-box depreciation pair 7.5.7 (decrease)/7.5.8 (increase); 7.5.11 description. Build: D5/D6 chain always shown; only `d_dep_increase_rb` exists (no decrease row); no description field. Instances: 7.5.1 (PARTIAL gate), 7.5.7 MISSING, 7.5.11 MISSING. Dedup: none.", "plain": "The guide shows the realisation-basis adjustments block only if the realisation basis was elected; ours shows it always. The guide (and the portal) also has a free-text description for these adjustments which we lack. (The portal has ONE depreciation row like ours, so the guide's second row is not counted against us.)"}, {"id": "FTA-004", "title": "Residency determination (§4.2.12–4.2.20) collapsed to a flat DTA line; POEM arm absent", "verdict_line": "**PARTIAL / MISSING · MEDIUM · needs Manthan**", "body": "Guide tree: 4.2.12 (UAE/FZ-incorporated? pre-pop) → Yes: 4.2.13 DTA-resident? → 4.2.14 country → 4.2.15 Non-Resident? (Yes → 4.2.20 basis; **No → straight to §11**); No: 4.2.16 foreign-incorporated but POEM in UAE? → 4.2.17/4.2.18 or → 4.2.19 country of incorporation → 4.2.20.\nBuild: Q7 `a_q7_uae_incorporated` is a disclosure with **no branches**; Q8 DTA asked to all; Q8=Yes → Q8a country + Q8b NR? (RULING 83); Q8b=Yes → 8c/8d/8e PE/nexus checkboxes (independent, by design R33/SAL-434); **Q8=Yes & Q8b=No → short return to Review = the guide's 4.2.15=No short-circuit (COVERED, RULING 86)**. **4.2.16–4.2.19 (POEM arm, country of incorporation) have no build trace.** Natural-person residency dropdown 4.1.9 + AED-1m PE turnover test not modelled (shared juridical flow).\nVerdicts: 4.2.12 PARTIAL; 4.2.13 COVERED-field/DIVERGENT-gating (KNOWN R83); 4.2.15 COVERED; 4.2.16–4.2.19 MISSING; 4.1.9 DIVERGENT; 4.1.10 PARTIAL. Ask Manthan: does the client base include foreign-incorporated entities managed from the UAE (POEM residents)? If yes, the arm is needed; if never, mark KNOWN-by-scope.", "plain": "The guide's residency questions branch: UAE-incorporated → DTA questions; foreign-incorporated → 'effectively managed in the UAE?' (POEM) → country of incorporation. Ours is a flat line (incorporated? DTA? non-resident? PE/nexus) — fine for UAE-incorporated companies (matches the portal screen for that persona), but a foreign-incorporated company managed from the UAE cannot be classified. Ask: do your clients include such entities?"}, {"id": "FTA-005", "title": "One Section-A questionnaire for all Taxable-Person types", "verdict_line": "**PARTIAL · LOW-MEDIUM**", "body": "Guide has four persona field-sets (§4.1 natural, §4.2 juridical, §4.4 UP-as-TP, §4.5 Tax Group) whose *semantics* differ (Tax Group \"any member\"/consolidated revenue; UP \"itself a partner\"; natural-person Turnover excludes employment/REI/personal-investment; NR natural person AED-1m test). Build: `SECTION_A_QUESTIONS` (section-a.ts:121) serves everyone; semantics are preparer knowledge. Instances: 4.1.3, 4.4.1–4.4.5 (PARTIAL), Tax-Group rows → FTA-020. Natural persons and partnerships are in-scope client types (SAL-155), so this is a real (if low-severity) gap.", "plain": "One Taxpayer-Details questionnaire serves natural persons, companies, partnerships and tax groups; the persona-specific meanings (e.g. natural-person turnover exclusions, 'any member' for groups) are left to the preparer's knowledge. Low impact; noted."}, {"id": "FTA-006", "title": "Reporting-only business-activity fields and registration pre-population absent", "verdict_line": "**MISSING · LOW**", "body": "4.x.6 (how many Businesses), 4.x.7 (list per registration), 4.x.8 (% revenue per sector = 100%), 4.2.19 (country of incorporation), header pre-pop table (§4 intro). Build: `enable_table:'business_activity'` stub \"arriving in a later phase\" (section-a.ts:194); nothing else. Guide itself: \"gathered only for reporting purposes and will not impact the determination of Taxable Income\". Portal-pre-pop by nature (caveat 2). Instances: 4.1.6–4.1.8, 4.2.9–4.2.11, 4.4.7–4.4.9, 4.5.7–4.5.9, 4.2.19.", "plain": "Reporting-only items the portal pre-fills from EmaraTax registration (list of businesses, % revenue per sector, country of incorporation, header details) are not in our product. The guide says they do not affect Taxable Income. Recorded, not counted as defects."}, {"id": "FTA-007", "title": "SBR eligibility gate incomplete; ineligible ⇒ disabled, guide ⇒ hidden", "verdict_line": "**PARTIAL · MEDIUM**", "body": "Guide: SBR fields do not appear unless Resident, not QFZP, not MNE member, and Revenue ≤ AED 3m in the current **and all previous** Tax Periods. Build `evaluateSbrEligibility` (section-b.ts:57): revenue ≤ 3m (current only) AND MNE=No AND A.9b≠Yes; ineligible ⇒ election rendered disabled with reason (SAL-322). Missing conditions: **Resident Person**, **≤3m in all prior periods** (year-2 family). Dedup: RULING 78/94 (mandatory), D-2 (SBR collapses C), UAT-001/035 — none cover the two conditions. Instances: 5.3.1, 5.3.2. Related KNOWN: SBR collapse of C/D/E/F (RULING 57).", "plain": "Small Business Relief: we check revenue ≤ AED 3m (this year), not an MNE member, not a QFZP. The guide also requires Resident status and revenue ≤ 3m in ALL previous periods; and it hides the SBR block when ineligible where we show it disabled with a reason. Ask: add the two conditions (the prior-period one belongs to the year-2 work)?"}, {"id": "FTA-008", "title": "Multi-period election memory / disqualification locks not modelled", "verdict_line": "**PARTIAL · KNOWN-DEFERRED (Year-2 family; READER-confirmed 16-Aug: owner ruled 14-Aug that UAT-013/014/015 year-2/carry-forward work waits until Manthan does year-2 returns; product is first-period-scoped today)**", "body": "Guide clauses that depend on prior-period state: 5.4.2 QG election pre-populated 'Yes' once made (irrevocable); 4.3.2 elect-out-of-QFZP question suppressed in later periods + MD 265 5-period lock; 4.3.3=No ⇒ no 0% for current+4; 12.1.15 de-minimis fail ⇒ not QFZP for subsequent 4 periods; 12.1.33–38 any 'No' ⇒ same 5-period consequence; 5.1.1 Tax-Group ex-member pre-pop. Build: once-only grey-lock exists for first-year elections (RULING 60) but no forward propagation of QFZP loss/5-period locks, no QG pre-pop-Yes. Dedup: Year-2 items deferred by owner (UAT-013/014/015; ROI-V2 delta \"year-2 carry-forward is the big gap\"). Instances: 5.4.2, 4.3.2, 4.3.3 (consequence), 12.1.15 (subsequent periods), 12.1.33–12.1.38 (consequence).", "plain": "Rules that depend on prior-period state — QG election pre-set to Yes once made, the elect-out-of-QFZP question disappearing in later years, the 5-period QFZP lock after a de-minimis failure or a 'No' confirmation — are not carried forward. Mayuresh has parked this whole family until year-2 returns are prepared. Listed for completeness."}, {"id": "FTA-009", "title": "Free-Zone confirmations: widget is portal-faithful (checkboxes, manual p31 → KNOWN); the \"any No ⇒ not QFZP\" consequence is un-ruled", "verdict_line": "**PARTIAL · MEDIUM (FZ family) · OPEN → Manthan (consequence half only)**", "body": "READER 16-Aug: UAT-098 covers the checkbox slot layout only, not semantics; the \"any No ⇒ not QFZP\" consequence is NOT ruled anywhere. The 5-period tail belongs to the Year-2 family (FTA-008) but the CURRENT-period disqualification is first-period-relevant and stays OPEN.\nGuide 12.1.33–12.1.38: six Y/N confirmations; any 'No' ⇒ not QFZP current+4 periods. Build: `fz_conf_*` checkboxes (fz-blocks.ts:400–427), `required:false`, non-blocking; an un-ticked box is indistinguishable from \"not answered\"; already ⚠ FILED in code (fz-blocks.ts:19–22, workbook \"Dropdown/Tickbox\"). Dedup: UAT-098 (checkbox slot layout only). Consequence → FTA-008.", "plain": "The Free-Zone confirmations (adequate assets/employees/opex, arm's length, TP documentation, audited FS) are tick-boxes — same as the portal. But the guide's consequence 'if any is No, not a QFZP for this and the next 4 periods' is not enforced anywhere. Ask: should an un-ticked confirmation block the 0% treatment in the current period?"}, {"id": "FTA-010", "title": "Free-Zone schedule field-shape divergences", "verdict_line": "**PARTIAL/DIVERGENT · LOW-MEDIUM (FZ family)** (portal p29–30 CONFIRMS: Qualifying Activities is a multi-select dropdown; both employee-count fields are shown side by side)", "body": "(a) 12.1.18 Qualifying Activities = free-text vs guide checkbox list (visibility gate on 12.1.17 correct, RULING 82/33; widget type NOT ruled ⇒ OPEN, LOW — context: the delivered V2 workbook is also free-text for this row). (b) 12.1.21/12.1.22 revealed on 12.1.20 Yes/No respectively vs guide \"always visible\" — the 12.1.20 radio is ruled (RULING 89 family, ledger ~451) but the reveal-vs-both-visible logic is NOT ruled ⇒ OPEN (PARTIAL); (N1+N2)/2 averaging typed not computed (1 dp accepted, RULING 131 → KNOWN). (c) 12.1.31 same averaging note. (d) 12.1.26 provider count auto-derived from #103 rows → KNOWN-DIVERGENT (RULING 89 + derived-count row, UAT-078/PR#297 family). (e) 12.1.32 supervision = one block-level radio vs per-provider repeat → KNOWN-DIVERGENT (RULING 89; READER-confirmed). (f) 12.1.39/12.1.40, 12.1.1–12.1.17, 12.1.19, 12.1.20, 12.1.23–12.1.25, 12.1.27–12.1.30 = COVERED.", "plain": "Free-Zone schedule shapes: the portal shows BOTH employee-count fields side by side (we reveal one or the other from 'all employees in FZ?'); 'Qualifying Activities undertaken' is a multi-select list in the portal (ours is free text); the outsourcing provider count and the single supervision confirmation follow your earlier rulings."}, {"id": "FTA-011", "title": "Qualifying-IP nexus inputs are period-only; FTA guide says cumulative life-to-date", "verdict_line": "**PARTIAL · HIGH (from Year 2) · OPEN → Manthan · owner-interest HIGH**", "body": "READER 16-Aug: not ruled — the S050 logic doc (13-Aug, ledger ~462) delivered the formulas but is silent on cumulation; open Q5 covers formulas only. Suggested wording for Manthan: \"For Schedule 12.2 (S050), should Qualifying Expenditure and Overall Expenditure be entered as LIFE-TO-DATE cumulative figures for each Qualifying IP asset (FTA Free Zone Persons guide §9.5, additive approach), with the product carrying the prior-period balances forward, or as current-period figures only as the delivered S050 sheet reads?\"\nSch 12.2.3 Overall Expenditure / 12.2.4 Qualifying Expenditure: FZ-Persons guide §9.5 (linked, fetched): \"additive approach … include all Qualifying/Overall Expenditures incurred over the life of the asset; the proportion of the cumulative numbers determines the percentage applied to Overall Income each Tax Period.\" Build `s050-ip-schedule.ts:84–85` captures single period figures; no accumulation. Formula chain 12.2.5–12.2.10 (uplift 30% capped, nexus ratio, excess, totals → 12.1.9) = COVERED and reproduces Ex 39/40/41 (9,000 / 156,000 / 244,000). Dedup: RULING 82 (fields), none on cumulation.", "plain": "Qualifying-IP nexus (S050): the FTA Free-Zone guide says Qualifying and Overall Expenditure accumulate over the LIFE of the IP asset; our schedule (and the delivered S050 sheet) capture the current period only, so the nexus ratio would drift from year 2. The formula itself is correct (matches the FTA worked examples). Ask: cumulative or per-period?"}, {"id": "FTA-012", "title": "Participation Exemption schedule — computation OWED; eligibility warnings differ", "verdict_line": "**KNOWN (OW-25) / PARTIAL / DIVERGENT · MEDIUM (PE family)**", "body": "18.17 exempt total: OWED (`schedule-registry.ts:332` throws OW-25; AS-TYPED Σ + editable C9 seed exist) → **KNOWN (OW-25; Q14 open)**. 18.4 forced-Yes when 18.2=UAE vs guide hidden → KNOWN-DIVERGENT-by-design (RULING 117 addendum). **18.10**: guide asks acquisition cost only if 18.9 <5% and WARNS when <5% and <AED 4m (\"PE not available\"); build always captures, no gate, no warning → **PARTIAL (warning clause MISSING) · OPEN → Manthan (READER: not ruled; RULING 123 defined the popup model from captures, no <5%/4m warning in captures or ledger)**. 18.13/18.14 'No' ⇒ build hard-refuses the row vs guide warning → **KNOWN-DIVERGENT** (RULING 123 addendum \"YES-ONLY on Add\" = explicit intent to block, from Manthan's own capture 15) — one-line tension for Manthan: the FTA guide says *warn*, his capture says *block*. 18.9 bounds → Q-A open (KNOWN-OPEN). 18.15/18.16 add-row controls = COVERED-by-mechanism (RULING 123). 7.7.5/7.7.6 (previously-exempt income/losses no longer qualifying): no non-FZ field; FZ slot re-labelled (fz-divergences.ts:62) → **KNOWN** (RULING 107d + PACKET ANSWER 8 \"same figures\" + RULING 125 income-feeds/losses-zero — fully ruled as built; READER-confirmed).", "plain": "Participation Exemption: the exempt total is a manual placeholder per your earlier agreement (OW-25). Two points: the guide's '<5% ownership AND <AED 4m cost ⇒ PE not available' warning is absent; and where you asked us to BLOCK a row answered 'No' on the 12-month/other-conditions questions, the guide says the portal only WARNS. Ask: confirm block vs warn; add the <5%/<4m warning?"}, {"id": "FTA-013", "title": "Interest-capping (§9.2 / Sch 19) — engine present, but several guide inputs never reach it", "verdict_line": "**PARTIAL · HIGH · KNOWN-OPEN (Q18) in part** (portal p82–87 CONFIRMS: Bank/Insurer determinant question, interest-income input, auto b/f, EBITDA input in the schedule popup)", "body": "Confirmed at 9b45d722: (i) **brought-forward disallowed NIE (19.2.3/19.3.1) reaches the vintage ledger display but NOT the engine — engine runs with b/f = 0** (ICLQ-2, interest-cap-ledger.ts:142); (ii) **interest income (19.2.2 / B3) has no carrier at all ⇒ NIE = gross interest expenditure**; (iii) expired tranches (19.3.4) are computed by the ledger but not fed to the engine (ICLQ-4); (iv) de-minimis gate keys on the 12M limb, not the higher-of limit (GAP-2, interest-cap.ts:14); (v) applicability exclusions (Bank/Insurance/natural person, 19.1) exist as an engine flag settable only via API body — no wizard determinant; §9.2 GIDLR block (F8) shown to every persona (guide hides it for natural persons/Banks/Insurers); (vi) 9.2.6 SIDLR captured but not computed (→ FTA-018); (vii) pre-9-Dec-2022 / QIP exclusions are tooltips (preparer-applied — acceptable). Formula core (higher of 12m/30% EBITDA, FIFO, floor) = COVERED. Dedup: Q18 (formula core, OPEN), RULING 106 (F10 auto). Recommend Manthan sees (i)–(ii) explicitly under Q18 — they change the disallowed figure.", "plain": "Interest capping: the formula core is right, but three inputs never reach the engine — brought-forward disallowed interest (engine computes with 0), interest INCOME (no field, so net = gross expenditure), and expired tranches. The Bank/Insurer/natural-person exemption cannot be set from the wizard. The portal captures all of these in its Interest Capping popup. Sits under your open Q18."}, {"id": "FTA-014", "title": "Related-Party / Connected-Person — ruled divergences plus one un-ruled gate", "verdict_line": "**KNOWN-DIVERGENT / PARTIAL · TP owner-interest HIGH** (portal p91–93: RPT popup gives adjustment 100 for income 100 vs ALP 200 ⇒ the build's SAL-326 income direction MATCHES the portal; the guide's literal 16.1.5−16.1.8 is loose. Portal p102: 9.3.3 additions are AUTO-filled from the schedule (guide: manual ≥ schedule; build: manual, RULING 124) — three-way tension, one line for Manthan)", "body": "16.1.9 tax adjustment: build signed two-way, no FTA-approval gate, income sign inverted vs guide `16.1.5−16.1.8` (SAL-326/DEC-101 client-confirmed) → KNOWN-DIVERGENT. 16.2.7: floored at zero vs guide plain difference (RULING 125) → KNOWN-DIVERGENT. 9.3.3/9.3.4/9.3.10 \"manual value ≥ schedule total\": schedule Σ is context-only by RULING 124 → KNOWN-DIVERGENT. **9.3.4 downward TP adjustment allowed only after successful FTA application — not gated anywhere (F12c free)** → PARTIAL, ask Manthan whether a confirmation/attestation is wanted. 16.2.1 \"aggregate incl. the CP's Related Parties\" not pulled (Q-V2-063 provisional) → PARTIAL. 16.1.2 \"Others\" vs \"Other\" → LOW. Everything else in Sch 16 (thresholds 40m/4m/500k, dropdowns, TP methods, gross-not-net) = COVERED.", "plain": "Related-Party / Connected-Person: thresholds, dropdowns and TP methods match. Two of your rulings are honoured (signed two-way RP adjustment — the portal computes the same direction; CP floor at zero). One un-ruled clause: a DOWNWARD TP adjustment is allowed only after a successful FTA application — we have no gate/attestation. And a three-way tension: portal auto-fills 'Additions… not at arm's length' from the schedule; guide says manual ≥ schedule; we key it manually (your RULING 124)."}, {"id": "FTA-015", "title": "Section-F \"capture-only\" amounts do not feed the computation", "verdict_line": "**PARTIAL · MEDIUM · needs Manthan (design)**", "body": "Guide treats these as Taxable-Income adjustments: 9.2.6 SIDLR, 9.3.6/9.3.7 non-arm's-length realised gains/losses, 9.4.2–9.4.6 QIF shares/distributions, 9.5.6/9.5.7 other adjustments. Build: fields exist and are required (RULING 99) but are CAPTURE-ONLY (\"fed to no computation this wave\", section-f-questions.ts:14/119); the COI ladder (client's computation template) has only generic manual lines C20 \"Other non-deductible\" / C23 \"Ministerial-decision adjustment\" ⇒ the preparer must double-key and the return can disagree with the computation. Ask Manthan: should these F amounts feed COI lines automatically (which), or is double-keying the intended control?", "plain": "Several Section-F amounts are captured but do not feed the computation (SIDLR non-deductible interest, QIF shares/distributions, 'other adjustments', gains/losses on assets received from related parties at non-arm's-length). The computation template only has generic lines, so the preparer keys them twice. Ask: should these flow automatically?"}, {"id": "FTA-016", "title": "Section-F line gaps", "verdict_line": "**MISSING / PARTIAL / KNOWN**", "body": "9.1.6 amounts withdrawn by a natural person (Art 33(5)) — no field (natural persons in scope, SAL-155) → **MISSING · MEDIUM**. 9.5.8 description of other adjustments → UNCLEAR (guide has it; portal Sep-2024 p111 does not). 9.1.3 donations ≤ Section-C disclosed donations validation absent → PARTIAL · LOW. 9.1.1 entertainment fixed read-only 50% (guide: \"may be more\") → KNOWN-DIVERGENT (RULING 97). 9.5.1 aggregate ≤ AED 10k never adjudicated (attestation by design, prior-period-form.ts:28) → PARTIAL/DIVERGENT-by-design. 9.5.6/9.5.7 required-when-visible vs guide blank-allowed → KNOWN (RULING 99).", "plain": "Section-F line gaps: no 'amounts withdrawn by a natural person' line (natural persons are in scope); donations are not validated against the Accounting-Schedule donations figure; entertainment is fixed at exactly 50% per your ruling (guide allows more). The 'other adjustments' description exists in the guide but not in the portal — not counted."}, {"id": "FTA-017", "title": "§7.9 international aircraft/shipping questions exist only on the FZ template", "verdict_line": "**KNOWN (workbook-faithful) · note for Manthan**", "body": "Guide §7.9 targets **Non-Resident** natural/juridical persons on any return. Build sources it from the FZ workbook only (`fz_aircraft_q`, section-de.ts:654, `fzOnly:true`). Tiebreak applied per READER: the 06-Jul V2 **non-FZ** \"ROI with Non Freezone Sections\" workbook has NO aircraft/shipping rows (checked 16-Aug: 0 hits on 'aircraft'), the FZ workbook has them (7 hits) ⇒ FZ-only is workbook-faithful (V2 governs; PACKET ANSWER 7 sheet-gated). Verdict KNOWN; one line for Manthan: the FTA guide places §7.9 on Non-Resident returns generally — does the non-FZ template need the block?", "plain": "International aircraft/shipping questions exist only on our Free-Zone template — faithful to your V2 workbooks (the non-FZ workbook has no such rows). The guide places them on Non-Resident returns generally. One line for you: does the non-FZ template need them?"}, {"id": "FTA-018", "title": "§7.6 transitional adjustments — nesting/pre-pop deltas; excluded gains never reach the computation", "verdict_line": "**PARTIAL · KNOWN-OPEN (Q-V2-061) · HIGH (money)**", "body": "7.6.1 cash pre-pop 'No' absent (→ FTA-001); D8 (7.6.6) top-level, not nested under D7; 7.6.3/7.6.5 typed not display-fed; 7.6.7/7.6.8 captured in-schedule. **All four transitional schedules compute the excluded amount (21.2.15/21.3.12/21.4.11/21.5.11) but `wireExcludedGainToCoi` throws — destination pinned open Q-V2-061; UAT-044 feeds partly wired.** Recommend closing Q-V2-061 with Manthan (it decides whether transitional relief affects Taxable Income at all).", "plain": "Transitional adjustments: the four transitional schedules compute the excluded amounts correctly, but those amounts are NOT yet wired into the Taxable-Income computation (open item Q-V2-061). Also: cash-basis pre-fill 'No' absent; the QFA/QFL disposal question sits at top level rather than under 'held qualifying assets?'."}, {"id": "FTA-019", "title": "Foreign-PE schedule (Sch 14 / §7.8) — loss-offset test absent; feed to computation open", "verdict_line": "**MISSING (14.1.6/14.1.7) · MEDIUM-HIGH · OPEN → Manthan (READER-confirmed: Q24 covers only C10 wiring; lines up with the owner's stored FPE decision Tree-1 \"prior FPE losses used ⇒ recapture restriction\", pending verification)**", "body": "Guide 14.1.6 (FPE losses offset vs subsequent FPE income) with rule **14.1.6 > 14.1.5 ⇒ exemption NOT available this period** (MD 116 Art 13(1)) and 14.1.7 auto c/f: no fields (delivered FPE workbooks formula-free, fpe-trio.ts:10–21). 14.1.1/14.1.4 not pre-populated from prior returns (manual/upload). 14.3 name+jurisdiction in one text column. FPE → COI C10 deliberately not wired (Q24 OPEN → KNOWN-OPEN). First-period grey (RULING 102) = COVERED.", "plain": "Foreign-PE schedule: no field for 'FPE losses offset against subsequent FPE income' and no 'if greater than losses utilised, the exemption is not available this period' test; no auto carry-forward; prior-period rows are typed/uploaded, not pre-populated. The FPE result is not wired to the computation (your open Q24)."}, {"id": "FTA-020", "title": "Tax-Group persona", "verdict_line": "**KNOWN (out of V1 scope: Phase 2)**", "body": "Annexure A + SAL-116. Rows: 4.5.1–4.5.9; 5.1.1/5.2/5.4.2 Tax-Group inheritance clauses; 6.1 consolidated FS; 9.2.5; 10.3.1–10.3.5; 15.2.1–15.2.5; 17.4–17.9 (Sch 17B, incl. ERROR messages 17.6.7/17.8.3); 19.1 member exclusion; 19.4.1–19.4.8; 19.5.1–19.5.13; 15.1 Tax-Group note. Recorded as a Phase-2 backlog inventory, not as findings. (READER to confirm.)", "plain": "Everything the guide says about TAX GROUPS (group Taxpayer Details, group loss schedule, pre-grouping losses/interest, group FTC attribution) is out of V1 scope — Phase 2 per the signed scope and your 26-Jun answer. Listed as a Phase-2 inventory, not as findings."}, {"id": "FTA-021", "title": "§8 Reliefs (Section E) collapsed to 6 fields each; QG current-period relief not fed to the computation", "verdict_line": "**MISSING / PARTIAL / DIVERGENT · MEDIUM-HIGH · KNOWN-OPEN (Q16) in part** (portal pp73–78 renders all 14 QG + 14 BRR rows inline incl. the clawback Y/N — the collapse originates in the client's V2 E-sheet, so this is a workbook-vs-portal gap for Manthan)", "body": "Guide 8.1/8.2 each have 14 fields. Build Section E: E1/E7 gate + amounts; **8.1.2/8.2.2 clawback Y/N, 8.x.8/8.x.9 now-realised, 8.x.12/8.x.13 other clawback, 8.x.14 description have no Section-E equivalent** (clawback data path exists via S151/S161 → C12/C13). 8.1.1/8.2.1 render ungated (guide: only if 5.4.1+5.4.2 / 5.5.2 elected). **8.1.4 & 20.2.8/20.2.9: S150 gain/loss captured but \"S150 gets NO feed\" (coi-feeds.ts:24, SAL-288) while BRR 8.2.4 → C13 IS fed** — asymmetric; Q16 (S150/S151 cluster) OPEN. Sch 20 role gating (Transferor-only fields, dropdowns, clawback registers) = COVERED. Dedup: RULING 100/UAT-035 (QFZP greys), Q16.", "plain": "Reliefs (QG transfers / BRR): our Section E has 6 fields each; the guide AND the portal have 14 (clawback yes/no, gains/losses now realised, other clawback adjustments, description). This comes from the V2 E-sheet we were given. Also the QG current-period gain/loss is captured but not fed to the computation while the BRR equivalent is (your open Q16); and the two 'need adjustments?' questions show even when the election was not made."}, {"id": "FTA-022", "title": "§10 Tax liability & credits — guide gates absent", "verdict_line": "**PARTIAL · MEDIUM · KNOWN-OPEN (Q22) in part** (portal p113–115 has ONE tax-losses question like the build ⇒ 10.2.1 downgraded to UNCLEAR; portal p136 pre-populates Tax Credits from the schedule ⇒ 10.4.4 decoupling confirmed)", "body": "10.2.1 \"any brought-forward Tax Losses?\" has no discrete Y/N (ledger opens off G2; no pre-pop 'Yes' from Sch 17A; no \"both No ⇒ straight to 10.4\" short-circuit). 10.4.3 credits question **not hidden when the return has a Tax Loss** (G4 always visible). 10.4.4 typed claim **decoupled** from the S080 schedule total (guide pre-populates) → Q22 over-credit exposure (KNOWN-OPEN). 10.1.1, 10.4.1/10.4.2 (375k band, QFZP 0%/9%), 10.4.5, 10.5 = COVERED.", "plain": "Tax liability & credits: the 'use tax credits?' question is not hidden when there is a Tax Loss; the typed tax-credit claim is not pre-populated from the schedule (portal greys it in) — your open Q22. The portal, like us, has a single tax-losses question, so the guide's extra 'brought-forward losses?' question is not counted."}, {"id": "FTA-023", "title": "Tax-losses schedule 17A — formula rows undelivered/proxied; QFZP loss split absent", "verdict_line": "**PARTIAL · HIGH · KNOWN-OPEN (Q19/Q20) in part**", "body": "17.1.10 c/f available for transfer: auto-calc undelivered (renders pending) — Q19. 17.3.1 \"available for transfer\" banner proxies **COI!C24 (TI before relief)** and 17.3.4 over-transfer warning uses that proxy — Q20. 17.2.3 own-losses-first / 75%-less-own cap and 17.3.4 recipient 75% cap + forfeiture not validated. 17.1.3/17.1.4 not gated on 8.2.3 / 5.5 election. **17.1.2: QFZP \"losses attributable to Qualifying Activities are NOT included\" — no split in loss engine/surface (FZ family; not ruled) → ask Manthan.** 75% utilisation cap (engine taxLossRelief), 17.1.1 pre-pop editable, 17.1.5–17.1.9 = COVERED.", "plain": "Tax losses: 'available for transfer' formula still undelivered (Q19), the transfer banner uses Taxable-Income-before-relief as a proxy (Q20), own-losses-first / recipient 75% caps not validated. Not yet ruled: for a QFZP, losses attributable to Qualifying Activities should be EXCLUDED from the loss schedule — we have no such split."}, {"id": "FTA-024", "title": "Foreign-tax-credit per-stream cap and evidence slot", "verdict_line": "**KNOWN-OPEN (Q22, lead item of the Manthan packet) for 15.1.6/15.1.7 · MISSING for 22.4.4 · MEDIUM**", "body": "15.1.6/15.1.7 (UAE CT due on that country's income; credit = lesser of) not computed per stream — Art 47(2) cap applied only globally at C30/C31 (SAL-163). 22.4.4 attachment slot \"evidence of tax paid in the foreign jurisdiction\" absent (attachments.ts has FS, QIP-MV, FA/FL-MV, residency). 15.1.1–15.1.5 columns = COVERED. Q22 adjacent.", "plain": "Foreign tax credit: the per-country cap ('UAE tax due on that income' vs foreign tax, lesser of) is applied only globally at the end — the portal computes it per stream (your open Q22). The 'evidence of foreign tax paid' attachment slot is absent."}, {"id": "FTA-025", "title": "Transitional schedules (Sch 21) — one un-ruled invariant, rest known", "verdict_line": "**DIVERGENT / KNOWN**", "body": "**21.5.4 liability rows: guide \"always 'No' (a liability cannot be a Participating Interest)\"; build shares the PE-exempt Y/N across halves with no lock — a preparer can answer Yes on a liability and hide E–K** → DIVERGENT · MEDIUM-LOW. 21.3.9 10-year cap soft/on total days (S180Q-1 filed) → KNOWN. 21.2.3/5/6 pre-pop from same-return register not prior return (RULING 91; no cross-year history) → KNOWN. Group-owner date/cost rules = tooltips (acceptable). Excluded amounts not wired → FTA-018. Formulas, gain-only floors (UAT-065/PR#278), N/A cascades on 21.2.7/21.3.6/21.4.4/21.4.6/21.5.6, method dropdown = COVERED.", "plain": "Transitional schedules: one un-ruled invariant — for LIABILITY rows the 'exempt under Participation Exemption?' answer must always be No (a liability cannot be a participation); ours allows Yes. Everything else follows earlier rulings."}, {"id": "FTA-026", "title": "Other schedules (Sch 22) — deferred-gains schedule absent; two visibility deltas", "verdict_line": "**MISSING / DIVERGENT / PARTIAL · MEDIUM · needs Manthan (22.3)**", "body": "**22.3 Deferred gains/losses schedule (22.3.1–22.3.6) has no build trace** — its outputs 7.5.5/7.5.6 exist as manual D6a/D6b amounts. Ask Manthan whether a schedule is wanted (UAT-032 \"no build\" precedent for schedule existence). 22.1.4–22.1.7: guide **hides** when 22.1.2=Yes AND 22.1.3=Yes; build keeps visible-but-optional (s220-schedule.ts:110, per delivered DV prompt) → DIVERGENT · LOW. 22.2.4/22.2.5: guide's asset-type rule (non-financial = excess over cost only; financial = all) not modelled — raw capture (RTQ-9) → PARTIAL. 22.4.1 FS attachment advisory, no SBR carve-out (R28/R38) → PARTIAL/KNOWN. 22.4.2/22.4.3 = COVERED.", "plain": "Other schedules: no 'deferred gains/losses realised this period' schedule (its two output amounts exist as manual fields); the OCI-schedule fields stay visible-but-optional where the guide hides them; unrealised gains/losses are captured raw without the financial vs non-financial asset rule; the FS attachment is advisory with no SBR carve-out. Ask on the deferred schedule."}, {"id": "FTA-027", "title": "Accounting Schedule (§6)", "verdict_line": "**PARTIAL · LOW-MEDIUM**", "body": "6.2.1 pre-pop 'Yes' when Revenue > AED 50m absent (only QFZP forced-Yes, RULING 103a); non-FZ optional regardless of revenue (UAT-037/RULING 103 KNOWN in part). 6.1 cash-only Income Statement → FTA-001. 6.2.2 visible only if 6.2.1=Yes, 6.2.3 = COVERED. §6 line-level fields are portal-defined (guide lists parts only) — not auditable from the guide.", "plain": "Accounting Schedule: the guide pre-fills 'audited = Yes' when revenue > AED 50m or QFZP; we force it only for QFZP."}, {"id": "FTA-028", "title": "Declaration (§11) shape", "verdict_line": "**KNOWN (portal-faithful; manual p141–142 shows greyed date, greyed 'prepared by: Taxable Person', one checkbox carrying both statements — exactly the build) · LOW**", "body": "11.1 date auto = submittedAt (guide calendar input); 11.2 prepared-by hardcoded \"Taxable Person\" (guide: TP/Agent/Legal Rep choice); 11.3 authority statement always shown (guide: preparer-only); 11.6 capacity absent. Block replicates the EmaraTax verification capture (declaration.ts). Nexdigm files as Tax Agent for clients? — if so 11.2/11.3/11.6 matter.", "plain": "Declaration block: matches the PORTAL exactly (greyed date, 'prepared by: Taxable Person', one checkbox with both statements). The guide's richer shape (agent/legal-representative choice, capacity) is not the live portal — not counted."}, {"id": "FTA-029", "title": "Exempt Persons (§23)", "verdict_line": "**MISSING / DIVERGENT-by-nature · LOW**", "body": "23.1.3: Government/Extractive answer (Q2) does not disable QG relief/BRR/loss transfer (Art 4(2)) → MISSING · LOW. 23.1.2 separate-return-per-Business mechanics absent → MISSING · LOW. 23.1.1 short-return route (DEC-113/SAL-382) = PARTIAL/KNOWN. 23.2 annual declaration = EmaraTax flow, out of product nature.", "plain": "Exempt Persons (government/extractive): our short-return route exists; the guide's restrictions for these entities (no QG relief/BRR/loss transfer) are not enforced. Rare persona; low."}, {"id": "FTA-030", "title": "§0 structural principles", "verdict_line": "**KNOWN / DIVERGENT-by-design (INFO)**", "body": "Redirect-out-to-schedule-and-back replaced by inline schedule surfaces (09-Aug ruling); return tailored by answers not registration type (caveat 2); parts A–I present but ordered/labelled per EmaraTax tabs (RULING 107/133); two-box add/deduct convention honoured where pairs exist (7.5.9/10, 8.x.10/11, 9.5.6/7) except 7.5.7 (FTA-003).", "plain": "Structure: schedules render inline (as the portal does for most blocks) rather than as the guide's 'directed to schedule and back'; the return is tailored by answers rather than registration data. Ruled/by-nature; no action."}, {"id": "FTA-INFO", "title": "Guide clauses that are preparer instructions, not portal validations (recorded COVERED with note)", "verdict_line": "", "body": "7.2.2 exclude declared dividend; 13.1 exclude Exempt-Person dividends; 18.8 no liquidation loss; 12.2.4 exclude RP-outsourced R&D; 21.x group first-owner rules (tooltips present for 21.1.3/21.4.2); 12.1.11–12.1.13 exclusion rules; 4.1.3 Turnover carve-outs. Where a hint/tooltip is cheap it is suggested in Part B notes.\n\n---", "plain": "Guide clauses that are preparer instructions rather than portal validations (e.g. exclude declared dividends from equity-method figures, exclude Exempt-Person dividends, no liquidation losses) — recorded as covered with a note; hints could be added cheaply."}], "strengths": ["Free-Zone de-minimis derivation (12.1.1–12.1.17): revenue segregation, auto total, lower-of-5%-or-AED-5m verdict, current-period breach handling — coded and matches the FTA Free-Zone guide's worked examples 5/6.", "Qualifying-IP nexus schedule (12.2.5–12.2.10): uplift capped at 30%/overall, nexus ratio, excess, feed to 12.1.9 — reproduces the FTA guide's examples 39–41 (uplift 9,000; qualifying income 156,000; excess 244,000).", "Interest-cap engine core (higher of AED 12m / 30% EBITDA, FIFO, floors), tax-loss 75% cap, 375k band + QFZP 0%/9% split, Sch 20 QG/BRR role gating, Sch 21 formulas and N/A cascades, Sch 16 thresholds/dropdowns/TP methods, Sch 13/15 columns, the DTA out-of-scope short return (4.2.15 = No → declaration), Bank/Insurer realisation-scope forcing, first-year once-only elections.", "**Test asset:** the FTA Free-Zone guide's de-minimis Examples 5/6 and IP-nexus Examples 39/40/41 are usable as golden vectors for our engine (documented in `notes/linked-guides-adjudication-notes.md`)."], "caveats": ["Guide §2.6: some schedules described are *not yet live* on the EmaraTax return — the portal itself may differ from the guide.", "The portal tailors the return from **registration data**; the product tailors from in-
