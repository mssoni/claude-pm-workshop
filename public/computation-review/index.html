<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computation screen — Nexdigm CT product review</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#17202f;--muted:#5d6879;--line:#e2e6ee;--accent:#0f5fb4;--accent2:#e8f0fb;--warn:#b45309;--bad:#b91c1c;--good:#15803d;--chip:#eef1f6;--side:#0b1f3a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}code{font:12.5px/1.4 ui-monospace,Menlo,monospace;background:var(--chip);padding:1px 4px;border-radius:4px}
aside{width:310px;flex:none;background:var(--side);color:#dbe4f3;height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:4px}
aside h1{font-size:15px;margin:0 0 2px;color:#fff;font-weight:650;line-height:1.3}aside .sub{font-size:12px;color:#9fb1cc;margin-bottom:8px}
aside .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8ea2c2;margin:12px 6px 3px}
aside .grp.sub2{margin:7px 6px 2px 6px;color:#7d93b6;text-transform:none;letter-spacing:0;font-size:11.5px;font-style:italic}
aside a.nav{display:block;padding:6px 9px;border-radius:8px;color:#dbe4f3;font-size:13.5px;line-height:1.35}aside a.nav:hover{background:#163257;text-decoration:none}aside a.nav.on{background:#1f4a86;color:#fff}
aside a.nav .d{display:block;font-size:11.5px;color:#9fb1cc;margin-top:1px}aside a.nav.on .d{color:#c9d8f0}
aside a.nav.cell{padding:5px 9px 5px 30px;position:relative}aside a.nav.cell .b{position:absolute;left:8px;top:6px;width:16px;height:16px;border-radius:50%;background:#2b4c7e;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
aside a.nav.cell.done .b{background:var(--good)}
aside .prog{margin:8px 6px;font-size:12px;color:#c9d8f0}aside .prog .bar{height:6px;background:#1c3660;border-radius:4px;overflow:hidden;margin-top:4px}aside .prog .bar i{display:block;height:100%;background:#22c55e;width:0}
aside .cst{margin-top:auto;font-size:11.5px;color:#9fb1cc;padding:8px 6px;border-top:1px solid #1c3660}
main{flex:1;min-width:0;padding:22px 34px 90px;max-width:1120px}
.view{display:none}.view.on{display:block}
h2{font-size:22px;margin:0 0 6px;font-weight:660}h3{font-size:15px;margin:18px 0 6px;font-weight:650;color:#0f2b52}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.val.upd{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px}
.val.ruled{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 10px}
.k.kupd{color:#b45309}.k.kruled{color:#15803d}
aside a.nav.cell.ruled .b{background:#15803d}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.ro{background:#e5e7eb;color:#374151}.chip.ed{background:#dcfce7;color:var(--good)}.chip.warn{background:#fef3c7;color:var(--warn)}.chip.fz{background:#ede9fe;color:#5b21b6}.chip.cls{background:#e0e7ff;color:#3730a3}
.imp{background:#fee2e2;color:var(--bad)}.imp.m{background:#fef3c7;color:var(--warn)}.imp.l{background:#e5e7eb;color:#374151}
.muted{color:var(--muted)}.small{font-size:13px}.foot{font-size:11.5px;color:#8b95a6;margin-top:6px}.foot code{font-size:11px;background:#f0f2f6}
.blk{display:grid;grid-template-columns:158px 1fr;gap:9px 14px;margin:8px 0}.blk .k{font-weight:650;color:#0f2b52;font-size:13.5px;padding-top:2px}.blk .k span{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.blk .val{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.blk .val.logic{border-left:4px solid #0f5fb4}.blk .val.today{border-left:4px solid #7c3aed}.blk .val.feeds{border-left:4px solid #0891b2}.blk .val.open{border-left:4px solid #b45309}
.q{background:#eef6ff;border:1px solid #bfd7f5;border-radius:12px;padding:14px 16px;margin:14px 0}.q .qq{font-weight:650;font-size:16px;color:#0b3a73}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.thumbs a{display:block;width:200px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.thumbs a img{display:block;width:100%;height:120px;object-fit:cover;object-position:top}.thumbs a span{display:block;font-size:11px;padding:4px 6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callbox{border:1px dashed #9db4d6;border-radius:12px;padding:12px 14px;background:#fff}
.callbox .qlabel{font-weight:650;font-size:13.5px;color:#0f2b52;margin:8px 0 3px}
.callbox .opts{display:flex;flex-direction:column;gap:5px;margin:4px 0 6px}.callbox .opts label{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.callbox textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.callbox input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px}
.callbox input.scf{width:100%;margin:2px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
button.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}button.btn.sec{background:#fff;color:var(--accent)}
.clist{margin-top:8px}.clist .c{border-left:3px solid var(--accent);background:#f3f7fd;padding:6px 10px;margin:6px 0;border-radius:6px;font-size:13.5px}.c .who{font-weight:600}.c .when{color:var(--muted);font-size:12px;margin-left:6px}
.pager{display:flex;justify-content:space-between;margin:16px 0;gap:8px}
table.reg{width:100%;border-collapse:collapse;font-size:12.5px}table.reg th,table.reg td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.reg th{background:#f1f4f9;position:sticky;top:0}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:78vh;overflow-y:auto}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;z-index:50;overflow:auto;padding:24px}#lb.on{display:block}#lb img{max-width:100%;display:block;margin:0 auto;background:#fff}#lb .cap{color:#fff;text-align:center;margin:8px 0 12px;font-size:14px}#lb .x{position:fixed;top:12px;right:16px;color:#fff;font-size:28px;cursor:pointer}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.noshot{background:#f1f4f9;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);font-size:12.5px;margin:8px 0}
@media(max-width:900px){body{display:block}aside{position:relative;height:auto;width:auto}main{padding:16px}.blk{grid-template-columns:1fr}.thumbs a{width:150px}}
@media print{aside,.callbox button,#lb{display:none}.view{display:block!important}}
</style><script src="comments-config.js"></script></head><body><aside><h1>Computation of Income — screen review</h1><div class="sub">Manthan review workbook · 2026-08-20 (v2 — your 17-18 Aug answers fed in) · build origin/main fe853fc0, 20-Aug (money wave M1-M4 live; screenshots = the 16-Aug build)</div><div id="nav"></div><div class="cst" id="cst"></div></aside><main id="views"></main><div id="lb"><span class="x">✕</span><div class="cap"></div><img alt="screenshot"></div><script>window.CR_DATA={"meta": {"date": "2026-08-20 (v2 — your 17-18 Aug answers fed in)", "screen": "/staff/filings/:id/computation", "build": "origin/main fe853fc0, 20-Aug (money wave M1-M4 live; screenshots = the 16-Aug build)", "src1": "computation-screen-replica-2026-08-16.md", "src2": "return-to-computation-mapping-table-2026-08-16.md"}, "cells": [{"n": 1, "id": "C5", "code": "C5", "label": "Accounting Income of the Taxable Person", "band": "income", "variant": "both", "mode_today": "Read-only — computed", "klass": "A", "logic": "The mapped financial-statement net profit, brought in as the starting accounting income and rounded once to whole AED. The screen does no maths of its own — the engine re-runs the ladder.", "feeds_in": "Financial-statement mapping — the rolled Section-C net profit (C!H23 → COI!C5).", "feeds_out": "C24 (taxable income before loss relief). Article 20(1).", "open": "", "src": "ladder.ts:556-557 · coi-surface.ts:94,440-447", "update": "**19-Aug:** two NEW lines now render in this band that the 16-Aug screenshots do not show — 'Share of income from Qualifying Investment Funds' (adds to accounting income) with its exempt share netted through a paired exempt line (net-nil when fully exempt). Your Section-F 'feed automatically' answer, built in PR #402."}, {"n": 2, "id": "C6", "code": "C6", "label": "Unrealised gains / (losses)", "band": "income", "variant": "both", "mode_today": "Read-only — from schedule", "klass": "", "logic": "A signed total from the Unrealised Gain/Loss schedule: gains minus losses. Read-only here; you change it by editing that schedule (the 'Reclassify upstream' link).", "feeds_in": "Return schedule #6 (Unrealised Gain/Loss — income recognised / loss recognised).", "feeds_out": "C24. Article 20(2)(a).", "open": "Signs flagged 'ratify at staging' — the plus/minus convention wants a passive confirm.", "src": "coi-ladder-feeds.ts:111-116,219-221"}, {"n": 3, "id": "C8", "code": "C8", "label": "Exempt income — dividends & profit distributions", "band": "income", "variant": "both", "mode_today": "Read-only — from schedule", "klass": "", "logic": "Minus the total of profit distributions (exempt income reduces income, so it is passed as a negative). Owned by the UAE Dividend schedule.", "feeds_in": "S060 UAE Dividend schedule (#11).", "feeds_out": "C24. Article 20(2)(b).", "open": "FILED note: an old prototype said a Section-D 'No' answer would hide this surface AND drop the feed; the build does NOT drop retained dividend rows while hidden. Worth confirming.", "src": "coi-ladder-feeds.ts:223-237"}, {"n": 4, "id": "C9", "code": "C9", "label": "Exempt income — participating interests", "band": "income", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "", "logic": "Pre-filled from the Participation Exemption schedule (losses-exempted minus income-exempted). You can overtype it and your number wins (an amber 'schedule says X · Restore' strip shows).", "feeds_in": "Participation Exemption schedule (#12).", "feeds_out": "C24. Article 20(2)(b).", "open": "Cross-variant divergence: on the FZ side PE losses are ignored (RULING 125); the non-FZ C9 feed still adds PE losses back. See mapping decision C-2.", "src": "coi-ladder-feeds.ts:239-243"}, {"n": 5, "id": "C10", "code": "C10", "label": "Exempt income — foreign permanent establishment", "band": "income", "variant": "both", "mode_today": "Editable — blank", "klass": "C", "logic": "Typed here as pure judgment; nothing pre-fills it and no schedule carries it today.", "feeds_in": "— (typed on this screen).", "feeds_out": "C24. Article 20(2)(b).", "open": "The Foreign-PE schedule totals exist but are NOT wired to this cell — see mapping decision C-2b (Q24).", "src": "coi-surface.ts:121 · ladder.ts:492", "update": "**Still open (Q24)** — see decision C-2b. Your 19-Aug portal note (14.1.5/6 don't appear separately on Emara) is recorded; the C10 seed itself remains unruled."}, {"n": 6, "id": "C12", "code": "C12", "label": "Qualifying Group Relief", "band": "income", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "C", "logic": "Pre-filled from the Qualifying-Group feed (gain minus loss per row). You can overtype; your entry wins.", "feeds_in": "S151 Qualifying-Group transfer schedule.", "feeds_out": "C24. Article 20(2)(c).", "open": "Feed signs flagged 'ratify at staging'.", "src": "coi-feeds.ts:85-88,114-121", "update": "**Ruled + built since 16-Aug** (your FTA-page reliefs answer → RULING 162(b), PR #407, live): the QG current-period gain/loss now **feeds C12 additively** from Section E / Schedule 20A — gain reduces, loss adds back, exactly as BRR. The old manual placeholder is gone."}, {"n": 7, "id": "C13", "code": "C13", "label": "Business Restructuring Relief", "band": "income", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "C", "logic": "Pre-filled from the Business-Restructuring relief and clawback rows, summed into one figure. You can overtype; your entry wins.", "feeds_in": "S160 relief + S161 clawback.", "feeds_out": "C24. Article 20(2)(c).", "open": "Feed signs flagged 'ratify at staging'.", "src": "coi-feeds.ts:92-101,122-135"}, {"n": 8, "id": "C15", "code": "C15", "label": "Not wholly & exclusively for business", "band": "addbacks", "variant": "both", "mode_today": "Read-only — from return", "klass": "B", "logic": "The amount classified on the return (Section F, Q6) as expenses not wholly and exclusively for business. Read-only add-back.", "feeds_in": "Return Section F, Q6.", "feeds_out": "C24. Article 20(2)(d).", "open": "", "src": "coi-ladder-feeds.ts:181-185"}, {"n": 9, "id": "C16", "code": "C16", "label": "Capital nature", "band": "addbacks", "variant": "both", "mode_today": "Read-only — but NO source", "klass": "B", "logic": "Shipped as a read-only add-back — but no return field actually feeds it, so it renders 0 every time. The 'Reclassify upstream' link points at a schedule that does not capture a capital-nature figure.", "feeds_in": "None today.", "feeds_out": "C24. Article 20(2)(d).", "open": "OPEN (D-BRD11-1): the module header calls C16 a 'blank-but-summed line entered on this grid', but the build ships it read-only with no way to enter it. Where should C16 come from, and should it be editable here? This is exactly the kind of cell your annotation resolves.", "src": "coi-surface.ts:134-143 · coi-ladder-feeds.ts:37-39"}, {"n": 10, "id": "C17", "code": "C17", "label": "Disallowed net interest (Art 30 cap)", "band": "addbacks", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "A", "logic": "Pre-filled with the Interest Capping schedule's computed disallowed interest; you can override it.", "feeds_in": "Interest Capping schedule (Q10).", "feeds_out": "C24. Article 30.", "open": "", "src": "coi-surface.ts:144-153,462-464,499", "update": "**20-Aug (PR #409, RULING 161 — your interest-cap answers built):** the cap now runs on **NET** interest (new interest-income box), brought-forward + expired tranches **feed the engine**, and the Bank/Insurer question (5.1.2) switches the block off with a reason. Still open: the two N-1 parameters (day-count + first-year seed)."}, {"n": 11, "id": "C18", "code": "C18", "label": "Entertainment (50% disallowed)", "band": "addbacks", "variant": "both", "mode_today": "Read-only — from return", "klass": "B", "logic": "50% of the gross client-entertainment figure. The gross is entered only in Section C; the engine applies the halving. Read-only.", "feeds_in": "Section C, client entertainment (H9).", "feeds_out": "C24. Article 32.", "open": "Settled by RULING 97 / UAT-028 to the Section-C gross (the old Section-F cell is now a derived read-only display).", "src": "coi-ladder-feeds.ts:187-208 · ladder.ts:38-40"}, {"n": 12, "id": "C19", "code": "C19", "label": "Expenditure related to exempt income", "band": "addbacks", "variant": "both", "mode_today": "Read-only — from return", "klass": "", "logic": "The amount on the return (Section F, Q4) for expenditure that produced exempt income. Read-only add-back.", "feeds_in": "Return Section F, Q4.", "feeds_out": "C24. Article 20(2)(d).", "open": "DISCLOSED FLIP (DEC-191): the owner's mockup showed C19 editable; the build ships it read-only (fed from its one entry home). Confirm the intended editability.", "src": "coi-ladder-feeds.ts:210-212"}, {"n": 13, "id": "C20", "code": "C20", "label": "Other non-deductible expenditure", "band": "addbacks", "variant": "both", "mode_today": "Read-only — from return", "klass": "", "logic": "The other-non-deductible rows total, plus non-QPBE charitable donations, plus the Section-F 'other NDE' figure. QPBE donations are deductible upstream and excluded.", "feeds_in": "Other-NDE schedule rows + charitable (non-QPBE) + Section F Q7.", "feeds_out": "C24. Article 20(2)(d).", "open": "", "src": "coi-ladder-feeds.ts:118-126,214-217", "update": "**19-Aug (PR #402, RULING 169):** now ALSO fed by SIDLR-disallowed interest (9.2.6) and Section-F 'other adjustments — increase'."}, {"n": 14, "id": "C21", "code": "C21", "label": "Related-party arm's-length adjustment", "band": "addbacks", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "", "logic": "Pre-filled with a one-way, taxpayer-adverse net: related-party upward minus downward, plus the connected-person disallowance. You can overtype; your entry wins.", "feeds_in": "S090 / S091 related-party schedules (+ per-transaction connected-person disallowance).", "feeds_out": "C24. Article 20(2)(e).", "open": "", "src": "coi-ladder-feeds.ts:128-135,245-249", "update": "**19-Aug (PR #402):** related-party non-arm's-length REALISED gains/losses (9.3.6/7) now feed C21, signed. One-look sign confirm = decision N-3. **M5 (building now):** the RPT/CP upward adjustments auto-fill their return fields per your 18-Aug answer (RULING 170)."}, {"n": 15, "id": "C22", "code": "C22", "label": "Incentives / special reliefs", "band": "addbacks", "variant": "both", "mode_today": "Editable — blank · LESS row", "klass": "C", "logic": "Typed here as pure judgment. This is a 'Less' row — you type a positive number and the ladder subtracts it.", "feeds_in": "— (typed on this screen).", "feeds_out": "C24 (subtracted). Article 20(2)(h).", "open": "The QIP excluded-gain transitional relief was NOT routed here — it was directed at C23 instead (see mapping decision C-3). C22 stays manual.", "src": "coi-surface.ts:194 · ladder.ts:595-622"}, {"n": 16, "id": "C23", "code": "C23", "label": "Ministerial-decision adjustment", "band": "addbacks", "variant": "both", "mode_today": "Editable — pre-filled", "klass": "C", "logic": "Pre-filled from the prior-period adjustment rows. You can overtype; your entry wins.", "feeds_in": "Prior-period adjustment rows (#107).", "feeds_out": "C24. Article 20(2)(i).", "open": "OPEN (Q-V2-061): the QIP excluded-gain transitional relief is the candidate to also feed C23 (entered negative). Not built — awaiting your ruling; the wire fails loudly until then. If it lands here, C23 becomes multi-source (see decisions C-3 / C-4).", "src": "coi-feeds.ts:104-107,136-142", "update": "**Live since 19-Aug (PR #395 + #402, RULING 171 — your 'feed automatically, keep editable' answer):** C23 is now multi-source and additive — the four transitional excluded-gain totals (entered negative, editable) + Section-F 'other adjustments — decrease' + the prior-period rows. The C22-vs-C23 home question is settled (C23 family)."}, {"n": 17, "id": "C24", "code": "C24", "label": "Taxable Income before tax-loss e M5 lane)."}, {"n": 16, "id": "C-2", "group": "collision", "covers": "rows 3, 4, 22", "title": "C-2 · Participation-exemption losses: FZ ignores them, non-FZ adds them back", "line": "Participation Exemption schedule (#12) → C9", "today": "On the FZ side PE losses are correctly ignored (RULING 125). On the non-FZ side the C9 feed still adds PE losses back (losses minus income). The two variants disagree.", "hint": "RULING 125 is currently FZ-scoped.", "question": "Does RULING 125 (participation-exemption losses ignored; income subtracts) extend to the NON-FZ C9 feed, or is it Free-Zone only?", "options": ["Extend to non-FZ (losses = 0 there too)", "Keep FZ-only (non-FZ keeps adding losses back)", "Discuss"], "src": "coi-ladder-feeds.ts:239-243"}, {"n": 17, "id": "C-3", "group": "collision", "covers": "rows 19, 20, 21", "title": "C-3 · Transitional excluded gains → C23 (negative)?", "line": "QIP #5 / intangible S180 #8 / financial-asset FA-FL #9-#10 — excluded-gain totals", "today": "All four disposal-schedule excluded-gain totals are fail-loud gated (nothing reaches the computation). The in-code candidate is C23, entered negative — C22 was rejected (it is enumerated exempt income, not a transitional adjustment).", "hint": "One ruling can cover all four disposal schedules. Note: the engine-side gate comment names C24 while the returns side names C23 — reconcile at ratification.", "question": "Confirm the QIP / intangible / financial-asset excluded gains should feed C23 (negative) for all four schedules — and confirm C22 is not the home.", "options": ["Yes — C23 (negative), all four", "A different cell (name it)", "Keep gated for now", "Discuss"], "src": "coi-feeds.ts:159-168,216-218 · excluded-gains.ts:22", "answered": "**You answered this on the FTA page 17-Aug** (\"It should be automatically feed but keep it editable\") → **RULING 171** (closes Q-V2-061): all four transitional excluded-gain totals feed the computation as **editable pre-fills reducing Taxable Income** — one rule for all four, internal line = ministerial adjustment entered negative (the C23 family; C22 rejected). **Built and live** (PR #395, the first money PR)."}, {"n": 18, "id": "C-4", "group": "collision", "covers": "row 16", "title": "C-4 · Prior-period C23 becomes multi-source", "line": "Prior-period adjustments (#107) → C23 (live)", "today": "C23 is live from the prior-period rows (RULING 36). If QIP / intangible / financial-asset gains ALSO route to C23 (decision C-3), the cell becomes multi-source and additive.", "hint": "Also open: whether the prior-period total should ALSO land on a Section-F return line (still 'ratify at staging').", "update": "**Half of this settled since 16-Aug:** RULING 171 (18-Aug) made C23 multi-source in fact — the transitional gains now land there alongside the prior-period rows, additively (built, PR #395 + #402). What survives is only the F-line half.", "question": "Remaining: should the prior-period adjustments total ALSO land on a Section-F return line (so it prints on the return), or stay computation-only?", "options": ["Computation-only — no F-line", "Also an F-line (name it below)", "Discuss"], "src": "coi-feeds.ts:104-107"}, {"n": 19, "id": "C-5", "group": "collision", "covers": "rows 37, 38", "title": "C-5 · Tax-loss transfers in / out (S110 / S111) are unwired", "line": "S110 losses claimed FROM others / S111 losses transferred TO others", "today": "All three destinations (the G-2b display and the two engine tax-loss feeds) are declared but NOT wired — the amounts display but reach no computation.", "hint": "Needs over-transfer handling too (own-losses-first, the recipient's 75% cap).", "question": "Authorise wiring the transfer-in total to G-2b + the engine 'losses claimed' feed, and the transfer-out total to the 'losses transferred' feed?", "options": ["Yes — wire both, with over-transfer guards", "Only one direction (say which)", "Not for V1", "Discuss"], "src": "tax-loss-transfer.ts:38-46", "answered": "**Ruled 18-Aug from your FTA-page tax-losses answer → RULING 164(c):** the available-for-transfer banner = row 17.1.10; a transfer **above** it is **refused** (17.3.4 \"limited to\"); the recipient-side 75% cap **warns** only; carried-forward = 17.3.1 − 17.3.4. The wiring builds in the M6 lane (queued behind the current money work)."}, {"n": 20, "id": "C-6", "group": "collision", "covers": "rows 17, 41", "title": "C-6 · Tax-credit cap (C29 / C30)", "line": "Foreign tax credit (S080) → C30 · Section-G tax credits → C29", "today": "C30 seeds the RAW foreign liability with no cap; C31 only floors at zero — so an over-credit is possible. The Section-G 'Tax Credits (AED)' is captured but not wired to C29.", "hint": "Candidate rule: MIN(foreign liability, UAE CT on that income).", "update": "**The formula half is ruled since 16-Aug** (RULING 172(5) + 177(1), 18-Aug): the foreign tax credit = **per income stream, the LESSER of (9% × that stream's foreign-source income as included in Taxable Income) and (the foreign tax paid/payable)** — nil where the income is exempt or the return shows a Tax Loss; global cap kept as fallback. Builds in the M7 lane; until it lands the screen still seeds the raw foreign liability (the over-credit disclosure shows).", "question": "Remaining: should the Section-G 'Tax Credits (AED)' capture wire to C29 (withholding credit), or does C29 stay typed by the preparer?", "options": ["Wire Section-G → C29", "Keep C29 typed", "Discuss"], "src": "coi-ladder-feeds.ts:251-253 · ladder.ts:721 · assembly.ts:2843-2844"}, {"n": 21, "id": "C-2b", "group": "divergence", "covers": "row 39", "title": "C-2b · Foreign-PE result → C10 (mirror C9)?", "line": "Foreign-PE schedules (#104 prior / #105 current / #106 ineligible) → C10", "today": "The C10 seed is unruled — the Foreign-PE totals are declared display-only and NOT wired to the computation.", "hint": "Mirroring the C9 arrangement is what open Q24 asks; and whether FPE losses follow the RULING-125 zero carve-out.", "update": "Your 19-Aug note on the FTA page is recorded (14.1.5/14.1.6 do not appear separately on the Emara portal — only the 14.1.7-style field). The C10 seed itself is still unruled — this is the open Q24.", "question": "Rule the C10 seed: should the Foreign-PE income total feed C10 (mirroring C9), and do FPE losses follow the losses-ignored carve-out?", "options": ["Yes — feed C10; losses ignored", "Feed C10; losses included", "Keep C10 manual", "Discuss"], "src": "fpe-trio.ts:217-228"}, {"n": 22, "id": "UGL-D5", "group": "divergence", "covers": "row 18", "title": "Unrealised gains/losses (D5, schedule #7) — which cell, without double-counting?", "line": "Section D5 · Unrealised gains & losses (UGL schedule #7)", "today": "Feeds a Section-D display cell only; NOT in the computation. The obvious home is C6 — but C6 is ALREADY fed by schedule #6, so routing #7 there too would double the unrealised line.", "hint": "Two schedules (#6 and #7) touch the same C6 concept.", "question": "Should the UGL #7 total auto-capture into a computation cell — and if so which, given C6 is already taken by schedule #6?", "options": ["Route #7 to C6 (and reconcile the #6 overlap)", "A different cell (name it)", "Keep capture-only", "Discuss"], "src": "assembly.ts:2922-2925 · ugl-schedule.ts:45-52"}, {"n": 23, "id": "OQ-1", "group": "divergence", "covers": "FZ sign map", "title": "OQ-1 · The Free-Zone two-column sign map is unratified", "line": "Free-Zone no303 'Taxable Income before loss adjustments' — every two-column row's contribution sign", "today": "On the FZ variant every two-column money row already contributes to a system-computed default with an editable override — the pattern RULING 145 wants, applied wholesale. But the contribution sign map (which rows add vs subtract) is build-current and client-UNCONFIRMED.", "hint": "This is the FZ side of the whole mapping — substantially built; only the signs want a ratify.", "question": "Ratify the Free-Zone two-column contribution sign map (which rows add, which subtract into the taxable-income default) as built?", "options": ["Ratify as built", "Ratify with changes (list below)", "Discuss"], "src": "fz-split-rows.ts:56"}, {"n": 24, "id": "N-1", "group": "new", "covers": "interest cap — the open Q18 pair", "title": "N-1 · Interest cap: pro-rata day-count + first-year opening balances", "line": "Interest Capping schedule — the AED 12m de-minimis pro-rata and the brought-forward vintage ledger", "today": "Everything you asked for on 17-Aug is built and live (20-Aug): the interest-INCOME box (the cap runs on net interest, matching your workbook B5 = B2 − B3 + B4), brought-forward + expired tranches now feed the engine, and the Bank/Insurer question switches the block off with a reason. Two parameters remain unstated in every primary we hold.", "hint": "The FTA guide and the workbook are both silent on the day-count convention; the first-year opening balances have no stated source.", "question": "(a) When a Tax Period is not 12 months, the AED 12m threshold pro-rates by days — divided by a fixed 365, or by the period's actual day count? (b) For a client's FIRST period on our platform, what seeds the brought-forward disallowed-interest ledger — an opening schedule the client provides (via IRL), or zero?", "options": ["(a) 365 fixed · (b) client opening schedule via IRL", "(a) actual period days · (b) client opening schedule via IRL", "(b) start from zero", "Discuss"], "src": "RULING 161 (18-Aug) kept this pair explicitly open"}, {"n": 25, "id": "N-2", "group": "new", "covers": "the generated Tax Computation excel", "title": "N-2 · Tax Loss Relief sheet: your blueprint formula vs the engine", "line": "Tax Computation.xlsx (your 17-Jul layout) — the Tax Loss Relief sheet", "today": "The generated computation workbook now follows your 17-Jul template exactly (COI + Annexure 1 + Annexure 2 + Tax Loss Relief — live since 19-Aug). One presentation call: your blueprint writes the set-off as C8 = −C3 × 75%; the engine applies the law's cap — set-off = the LOWER of (losses actually available) and (75% × Taxable Income). Same figure when losses are plentiful; different when the available loss is below the ceiling. The sheet currently prints the ENGINE's figures with the rule stated.", "hint": "Art 37(2): loss relief cannot exceed 75% of Taxable Income; utilisation also cannot exceed the losses that exist.", "question": "Confirm the document should print the engine's figures (lower-of rule, stated on the sheet) rather than the blueprint's −C3 × 75% shorthand?", "options": ["Yes — engine figures with the rule stated", "Print the blueprint formula (explain below)", "Discuss"], "src": "PR #396 body · RULING 164"}, {"n": 26, "id": "N-3", "group": "new", "covers": "three signs, live on the test portal", "title": "N-3 · Three feed directions to eyeball on the test portal", "line": "Section-F feeds (live 19-Aug) — the flagged sign conventions", "today": "Your Section-F 'feed automatically' answer is built and live. Three directions were implemented from the guide's wording and flagged for your one-look confirm: (1) QIF interest income folds INTO the interest-cap net-interest figure (B3); (2) related-party non-arm's-length REALISED gains/losses feed C21 keeping their sign (gain adds, loss reduces); (3) Section-F 'other adjustments — decrease' feeds C23 as a negative.", "hint": "All three match the guide's directions (p.81-88); this is a passive ratify, not a design question.", "question": "Open any return on the test portal and confirm the three directions look right — or name the one that doesn't.", "options": ["All three correct", "One or more wrong (say which below)", "Discuss"], "src": "PR #402 — flagged ratify-at-staging"}], "mapgroups": [["unknown", "The 14 captured-but-unmapped lines", "Money the return captures today that reaches NO computation cell. Each needs a destination ruling before anything is wired — a guessed cell is a fabricated destination. The Free-Zone sibling's direction (add / subtract) is the only precedent, and it is cited."], ["collision", "The 6 collisions", "Auto-mapping these would require you to overturn or confirm an existing ruling, or would double-count against a cell that already consumes the figure. Each is framed as a keep-or-change decision."], ["divergence", "PE / FPE loss divergence, UGL, and the FZ sign map (OQ-1)", "Where the two variants disagree today (participation-exemption and foreign-PE losses), the one double-count risk (UGL), and the one Free-Zone ratification that unblocks the whole FZ side."], ["new", "New since 16-Aug — still needed", "Questions that arose from BUILDING your 17-18 Aug FTA-page answers: two open parameters and three one-look sign confirmations. Everything you already answered is marked green on this page — nothing is asked twice."]], "bands": [["income", "Income & accounting base"], ["addbacks", "Add-backs"], ["deductions", "Deductions & reliefs"], ["tax", "Taxable income & tax"], ["other", "On-screen (non-ladder)"]], "solid": ["**The engine is the only calculator.** This screen does no arithmetic of its own — it re-runs the same engine ladder over the declared return, so the screen, the PDF extract and the Excel extract can never disagree.", "**C5 accounting income** is fed from the financial-statement mapping and rounded once to whole AED — ruled and fed. *(ladder.ts:556-557)*", "**C8 dividends** correctly passes exempt income as a negative, owned by the UAE Dividend schedule. *(coi-ladder-feeds.ts:223-237)*", "**C15 not-wholly-exclusive**, **C19 exempt-income expenditure**, **C20 other non-deductible** are fed from their single return homes — no double-keying. *(coi-ladder-feeds.ts:181-217)*", "**C17 interest cap** is pre-filled from the Interest Capping schedule's computed disallowed interest and overridable. *(coi-surface.ts:462-464)*", "**C18 entertainment** applies the 50% halving in the engine from a single Section-C gross — RULING 97 / UAT-028 settled, the old Section-F cell is now a derived read-only display. *(coi-ladder-feeds.ts:187-208)*", "**C21 related-party** consumes a one-way, taxpayer-adverse net (upward − downward + connected-person) — the direction matches the portal's own popup. *(coi-ladder-feeds.ts:128-135)*", "**C24 / C26 / C27 / C28 / C31** subtotals and rate bands are code-traceable to the ladder; the 0% band is always 0, the 9% band is 9% over AED 375,000, and C31 is floored so a credit never refunds. *(ladder.ts:604-722)*", "**C25 tax-loss set-off** applies the utilised row and is correctly gated by the Art-39 continuity checkbox (untick → 0, whole balance carries forward). *(coi-surface.ts:465-467,506)*", "**The rate path is driven by Section A + the Free-Zone details only** — no computation-page input can flip the rate (RULING 65; the old QFZP/split checkboxes were removed). *(computation-service.ts:414-420)*", "**C29 / C30 credits disable when there is no corporate tax to relieve** — you can't record a credit against zero tax. *(computation-service.ts:330-339)*", "**Fail-loud gates.** Where the engine cannot compute honestly (participation exemption, qualifying-group aggregation, the QIP excluded-gain wire) it REFUSES rather than guess a number. *(ladder.ts:520-538 · coi-feeds.ts:216-218)*", "**The whole Free-Zone two-column mechanism** already contributes every money row to a system-computed taxable-income default with an editable override — the seed-editable pattern, applied wholesale. Only the sign map wants a ratify (OQ-1). *(fz-split-rows.ts)*"], "glossary": [["Cell / C-code", "One line on the Computation screen (C5 … C31). The letter-number is the code the return and the engine share."], ["Class A / B / C", "The screen's legend. A = read-only, computed by the engine. B = classify-then-compute (a human classifies the underlying lines upstream, the engine applies the rule). C = pure judgment, human-entered, never system-computed."], ["Seed / seeded / pre-filled", "A cell arrives pre-filled from its owning schedule but you may overtype it — your number always wins, and an amber 'schedule says X · Restore' strip appears. Restoring drops your entry so the schedule governs again."], ["Feed / fed line", "A read-only cell whose number lives in exactly ONE upstream place; you change it only via the 'Reclassify upstream' link, never by typing here — so the return and the computation can never disagree."], ["Carrier", "The persisted return field or schedule column a feed reads from. 'No carrier' (C16) means the cell is declared fed but nothing actually fills it."], ["Gate / fail-loud", "A seam the engine refuses rather than guess: it throws an error instead of inventing a number, until the rule is ruled."], ["'Less' row", "C22, C25, C29, C30 — you type a positive number and the ladder SUBTRACTS it. A leading minus on screen is display-only."], ["Extract / stamp", "Minting a versioned, immutable copy of the computation (engine version, timestamp, CT payable). Any edit after an extract mints a new version."], ["De-minimis", "The Free-Zone threshold test: non-qualifying revenue must stay at or below the LOWER of (5% of total revenue, AED 5m); a breach loses Free-Zone status for this year and the next four."], ["no303 / two-column default", "On a Free-Zone filing, the system-computed 'Taxable Income before loss adjustments' that every two-column money row contributes to, with an editable override (RULING 34)."], ["Ruling / RULING nnn · Q-nnn · OQ / SAL / DEC", "A recorded decision (or open question) in the project's ruling ledger. Cited so engineers can trace each claim; you can ignore the codes."]], "sections": [["start", "Start here", "How to read this, and the three questions asked on every cell."], ["cells", "The 30 cells", "The Computation screen, top to bottom, grouped as the screen groups it. Answer each in place."], ["mapping", "Mapping proposal (28)", "The auto-capture questions: 14 unmapped lines, 6 collisions, the PE/FPE divergence, and the Free-Zone sign map.   <div class="qlabel">Comment (optional)</div><textarea placeholder="Anything else…"></textarea>
  <div class="row"><input type="text" class="who" placeholder="Your name" value="${esc(localStorage.getItem('cr-who')||'')}"><button class="btn save">Save answer</button><span class="small muted saved"></span></div><div class="clist"></div></div>`; }
function wire(){ $$('.callbox').forEach(box=>{ const anchor=box.dataset.anchor, section=box.dataset.section, kind=box.dataset.kind; const list=$('.clist',box); renderC(anchor,list);
  $('.save',box).addEventListener('click',async()=>{ const who=$('.who',box).value.trim(); if(!who){alert('Please add your name so we know who answered.');$('.who',box).focus();return;} localStorage.setItem('cr-who',who);
    let choice='',text='';
    if(kind==='cell'){ const c=($('input[name$="-c"]:checked',box)||{}).value||''; const scf=$('.scf',box).value.trim(); const m=($('input[name$="-m"]:checked',box)||{}).value||''; const cm=$('textarea',box).value.trim();
      if(!c&&!scf&&!m&&!cm){alert('Answer at least one of the three questions, or add a comment.');return;}
      choice=c||''; const parts=[]; if(c)parts.push('Correct?: '+c); if(scf)parts.push('Should come from: '+scf); if(m)parts.push('Mode: '+m); if(cm)parts.push('Comment: '+cm); text=parts.join('\n'); }
    else { choice=($('input[type=radio]:checked',box)||{}).value||''; text=$('textarea',box).value.trim(); if(!choice&&!text){alert('Pick an option or write a comment.');return;} }
    const c={anchor,section,who,text,choice,when:new Date().toISOString(),synced:false}; const ok=await remotePost(c); c.synced=ok; const a=loadLocal(); a.push(c); saveLocal(a);
    if(kind==='cell'){$$('.scf,textarea',box).forEach(f=>f.value='');} else {$('textarea',box).value='';}
    $('.saved',box).textContent=ok?'Saved to the shared database ✓':'Saved on this device ✓ (will sync / export)'; if(ok) await remoteFetch(); renderC(anchor,list); status(); markDone(); }); }); }
function answeredSet(){ return new Set([...remote.map(c=>c.anchor),...loadLocal().map(c=>c.anchor)]); }
function markDone(){ const A=answeredSet(); let n=0; const total=D.cells.length+D.decisions.filter(d=>!d.answered).length;
  D.cells.forEach(c=>{const on=A.has('cell:'+c.id); if(on)n++; const a=$(`a.nav[data-view="cell-${c.id}"]`); a&&a.classList.toggle('done',on);});
  D.decisions.forEach(d=>{const on=A.has('map:'+d.id); if(on&&!d.answered)n++; const a=$(`a.nav[data-view="map-${d.id}"]`); a&&a.classList.toggle('done',on);});
  const p=$('#prog'); if(p){p.querySelector('span').textContent=`${n} of ${total} answered`; p.querySelector('i').style.width=(100*n/total)+'%';} }
function exportAll(){ const a=[...remote.map(c=>({anchor:c.anchor,who:c.commenter,choice:c.choice,text:c.body,when:c.created_at})),...loadLocal().filter(c=>!c.synced)]; const lines=['# Computation review — answers export','','Exported: '+new Date().toISOString(),'']; a.forEach(c=>lines.push(`- **${c.anchor}** · ${c.who} · ${c.when}${c.choice?' · **'+c.choice+'**':''}\n  ${(c.text||'').replace(/\n/g,'\n  ')}`)); const txt=lines.join('\n')+'\n\n```json\n'+JSON.stringify(a,null,1)+'\n```\n'; const blob=new Blob([txt],{type:'text/markdown'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='computation-review-answers-'+new Date().toISOString().slice(0,10)+'.md'; document.body.appendChild(l); l.click(); l.remove(); navigator.clipboard&&navigator.clipboard.writeText(txt).catch(()=>{}); alert('Answers exported (downloaded + copied). Please send the file to Mayuresh.'); }
// ---- views ----
function shotsBlock(list){ return list&&list.length? thumbs(list) : (D.haveShots? '' : `<div class="noshot">Screenshot not captured for this cell in this build. See the full-page shot under "What our screen looks like" if present.</div>`); }
function cellView(c,i){ const cells=D.cells; const prev=cells[i-1],next=cells[i+1]; const bandName=(D.bands.find(b=>b[0]===c.band)||[])[1]||''; const imgs=D.imgmap[c.id]||[];
 const vchip = c.variant==='FZ'?'<span class="chip fz">Free-Zone only</span>':'<span class="chip">Both variants</span>';
 const kls = c.klass?`<span class="chip cls">Class ${esc(c.klass)}</span>`:'';
 return `<section class="view" id="v-cell-${c.id}"><div class="small muted">Cell ${i+1} of ${cells.length} · ${esc(bandName)} · ${vchip} ${kls}</div>
 <h2>${esc(c.code)} — ${esc(c.label)}</h2>
 <div class="card"><div class="blk">
  <div class="k">Today's treatment <span>what the build does now</span></div><div class="val today">${modeChip(c.mode_today)}</div>
  <div class="k">What it does <span>in plain words</span></div><div class="val logic">${md(c.logic)}</div>
  <div class="k">Feeds in / out <span>return lines & downstream</span></div><div class="val feeds"><b>In:</b> ${md(c.feeds_in)}<br><b>Out:</b> ${md(c.feeds_out)}</div>
  ${c.update?`<div class="k kupd">Since 16-Aug</div><div class="val upd">${md(c.update)}</div>`:''}
  ${c.open?`<div class="k">Known open question</div><div class="val open">${md(c.open)}</div>`:''}
 </div>${shotsBlock(imgs)}<div class="foot">Source: <code>${esc(c.src)}</code> · computation-screen-replica-2026-08-16.md</div>
 <div class="q"><div class="qq">Your call — three questions</div>${cellbox('cell:'+c.id,bandName)}</div></div>
 <div class="pager">${prev?`<button class="btn sec" onclick="go('cell-${prev.id}')">← ${esc(prev.code)}</button>`:`<button class="btn sec" onclick="go('start')">← Start</button>`}${next?`<button class="btn" onclick="go('cell-${next.id}')">${esc(next.code)} →</button>`:`<button class="btn" onclick="go('map-'+D.decisions[0].id)">On to the mapping proposal →</button>`}</div></section>`; }
function mapView(d,i){ const ds=D.decisions; const prev=ds[i-1],next=ds[i+1]; const gname=(D.mapgroups.find(g=>g[0]===d.group)||[])[1]||'';
 return `<section class="view" id="v-map-${d.id}"><div class="small muted">Mapping decision ${i+1} of ${ds.length} · ${esc(gname)} · covers ${esc(d.covers)}</div>
 <h2>${esc(d.title)}</h2>
 <div class="card"><div class="blk">
  <div class="k">The line</div><div class="val">${md(d.line)}</div>
  <div class="k">Today <span>what the build does</span></div><div class="val today">${md(d.today)}</div>
  <div class="k">Hint / precedent</div><div class="val feeds">${md(d.hint)}</div>
  ${d.update?`<div class="k kupd">Since 16-Aug</div><div class="val upd">${md(d.update)}</div>`:''}
  ${d.answered?`<div class="k kruled">Already ruled ✓</div><div class="val ruled">${md(d.answered)}</div>`:''}
 </div><div class="foot">Source: <code>${esc(d.src)}</code> · return-to-computation-mapping-table-2026-08-16.md</div>
 ${d.answered?`<div class="q"><div class="qq">No answer needed</div><p class="small muted">This one is settled by your own answer above — it is shown so nothing moves without you seeing it. Comment only if you disagree.</p>${callbox('map:'+d.id,gname,'Comment (only if you disagree)',["I disagree — reopen (say why below)"])}</div>`:`<div class="q"><div class="qq">Your call</div><p>${md(d.question)}</p>${callbox('map:'+d.id,gname,'Answer',d.options)}</div>`}</div>
 <div class="pager">${prev?`<button class="btn sec" onclick="go('map-${prev.id}')">← Prev</button>`:`<button class="btn sec" onclick="go('cell-${D.cells[D.cells.length-1].id}')">← Last cell</button>`}${next?`<button class="btn" onclick="go('map-${next.id}')">Next →</button>`:`<button class="btn" onclick="go('solid')">Done — see what's solid →</button>`}</div></section>`; }
function render(){
  // nav
  let nav=`<a class="nav" data-view="start" href="#start">Start here<span class="d">${esc(D.sections[0][2])}</span></a>`;
  nav+=`<div class="grp">The 30 cells — answer each</div>`;
  D.bands.forEach(([bid,bname])=>{ const cs=D.cells.filter(c=>c.band===bid); if(!cs.length)return; nav+=`<div class="grp sub2">${esc(bname)}</div>`+cs.map(c=>`<a class="nav cell" data-view="cell-${c.id}" href="#cell-${c.id}"><span class="b">${esc(c.code.replace(/[^0-9QN]/g,'').slice(0,3)||'•')}</span>${esc(c.code)} · ${esc(c.label)}</a>`).join(''); });
  nav+=`<div class="prog" id="prog"><span>0 answered</span><div class="bar"><i></i></div></div>`;
  nav+=`<div class="grp">Mapping proposal (${D.decisions.length})</div>`;
  D.mapgroups.forEach(([gid,gname])=>{ const dd=D.decisions.filter(d=>d.group===gid); if(!dd.length)return; nav+=`<div class="grp sub2">${esc(gname)}</div>`+dd.map(d=>`<a class="nav cell${d.answered?' ruled':''}" data-view="map-${d.id}" href="#map-${d.id}"><span class="b">${d.answered?'✓':esc(d.id.replace(/[^0-9]/g,'')||'•')}</span>${esc(d.id)} · ${esc(d.title.replace(/^[^·]*·\s*/,'').slice(0,52))}</a>`).join(''); });
  nav+=`<div class="grp">Reference</div>`;
  D.sections.slice(3).forEach(([id,name,desc])=>{ nav+=`<a class="nav" data-view="${id}" href="#${id}">${esc(name)}<span class="d">${esc(desc)}</span></a>`; });
  $('#nav').innerHTML=nav;
  // views
  let v=`<section class="view" id="v-start"><h2>Start here</h2><div class="card">
  <p><b>What this is.</b> A top-to-bottom transcription of our built <b>Computation of Income</b> screen (<code>${esc(D.meta.screen)}</code>) — one card per line the preparer sees, in render order, with the exact logic behind each cell and a real screenshot to point at. It is built from the code we ship (build ${esc(D.meta.build)}), not a prototype. Your job: for each cell, say whether the logic is <b>right</b>, where it should <b>come from</b>, and whether it should be <b>read-only or editable</b>.</p>
  <h3>Where things stand — updated 20-Aug</h3>
  <div class="val ruled" style="margin:8px 0"><b>What we already know (fed in, nothing re-asked).</b> Your 17-18 Aug answers on the FTA-audit page became rulings and most are ALREADY BUILT: transitional excluded gains → computation (live) · Section-F feeds incl. QIF lines (live) · Qualifying-Group relief → C12 (live) · interest-cap inputs — income box, b/f + expired feed, bank/insurer gate (live) · TP upward auto-fill (building) · tax-loss formulas + QFZP split (ruled, building) · foreign-tax-credit per-stream cap (ruled, building) · S050 cumulative + rolling average (ruled). Decisions settled by those answers are marked <b>green ✓</b> in the left index — they need nothing from you.</div>
  <div class="val upd" style="margin:8px 0"><b>What we still need (the progress bar counts only these).</b> The 30 per-cell verdicts below, the still-open mapping decisions (equity-method, partnership and realisation-basis destinations · the QG #18 record · shipping double-surface · PE/FPE loss questions · UGL home · the Free-Zone sign map), and three NEW items from building your answers: <b>N-1</b> interest-cap day-count + first-year opening balances · <b>N-2</b> the Tax Loss Relief sheet presentation · <b>N-3</b> three feed signs to eyeball on the test portal.</div>
  <p class="small muted">The screenshots are from the 16-Aug build; the screen has since been reworked to your BRD shape (banners removed, the nine template notes render under the table, extract in the bottom bar) and the new QIF lines are not pictured — each affected card carries an amber "Since 16-Aug" note with what changed.</p>
  <h3>The three questions on every cell</h3>
  <div class="blk"><div class="k">1 · Correct?</div><div class="val">Is the logic behind the cell right — or wrong (say how)?</div>
  <div class="k">2 · Should come from?</div><div class="val">Where should the number originate — keep it as-is, a named schedule, or a specific return line?</div>
  <div class="k">3 · Read-only or editable?</div><div class="val">Should the preparer be able to type here — read-only (owned upstream), editable and pre-filled, or editable and blank?</div></div>
  <p class="small muted">Two chips you'll see: <span class="chip ro">Read-only</span> the number lives in one upstream place and can't be typed here · <span class="chip ed">Editable</span> you can type / overtype (pre-filled cells show an amber "schedule says X · Restore" strip when you override). "Class A/B/C", "seed", "feed", "gate" are all in the Glossary.</p>
  <h3>How to use this page</h3><p>Use the left index — it mirrors the screen's own order (Income &amp; accounting base → Add-backs → Deductions &amp; reliefs → Taxable income &amp; tax → the on-screen extras), then the <b>mapping proposal</b> (the auto-capture decisions — green ✓ ones are already ruled and need nothing), then the reference sections. Answer in place, add a line if you like, click <b>Save answer</b>. The progress bar on the left counts answered cells + decisions. Nothing is built until you have answered and Mayuresh confirms.</p>
  ${D.allimgs.length?`<h3>The screens we captured (real stack)</h3><p class="small muted">Full-page shots and per-band crops of our built Computation screen, plus the Return steps the figures come from — a fresh migrated database, the seeded Primary logged in through the real UI, zero injected data. Click any to zoom.</p>${thumbs(D.allimgs)}`:''}
  <div class="banner">Nothing here has been actioned. These annotations become rulings or build items only after your review. Where a line's destination is genuinely unpinned it is marked UNKNOWN — no cell was invented.</div>
  <div class="pager"><span></span><button class="btn" onclick="go('cell-${D.cells[0].id}')">Start with ${esc(D.cells[0].code)} →</button></div></div></section>`;
  D.cells.forEach((c,i)=>v+=cellView(c,i));
  D.decisions.forEach((d,i)=>v+=mapView(d,i));
  // solid
  v+=`<section class="view" id="v-solid"><h2>What's already correct</h2><p class="small muted">Cells whose logic is ruled and fed — the balanced picture.</p><div class="card"><ul>${D.solid.map(s=>`<li>${md(s)}</li>`).join('')}</ul></div><div class="pager"><button class="btn sec" onclick="go('map-'+D.decisions[D.decisions.length-1].id)">← Last decision</button><button class="btn sec" onclick="go('replica')">Full replica table →</button></div></section>`;
  // replica
  const cols=D.replica.length?Object.keys(D.replica[0]).slice(0,11):[];
  v+=`<section class="view" id="v-replica"><h2>Full replica table (reference)</h2><p class="small muted">Every cell with its logic, feeds and file:line — the CSV twin of the source replica. You do not need to read this; it is here so every claim on the cards traces to a line of code.</p><div class="tblwrap"><table class="reg"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${D.replica.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  // glossary
  v+=`<section class="view" id="v-glossary"><h2>Glossary</h2><div class="card"><div class="blk">${D.glossary.map(([t,d])=>`<div class="k">${esc(t)}</div><div class="val">${md(d)}</div>`).join('')}</div></div></section>`;
  // sources
  v+=`<section class="view" id="v-sources"><h2>Sources &amp; method</h2><div class="card small">
  <p><b>Primary sources.</b> This page is generated from two code-faithful audit documents in the wrapper:</p>
  <ul><li><code>${esc(D.meta.src1)}</code> — the cell-by-cell replica of the built Computation screen (30 cells, logic + feeds + file:line per cell, open questions).</li>
  <li><code>${esc(D.meta.src2)}</code> — the return-to-computation auto-capture mapping (the 28 questions, the collisions, the unknown-destination cluster, the Free-Zone sign map).</li></ul>
  <p><b>Build of record.</b> ${esc(D.meta.build)}. The COI engine, the surface partition, the feed maps and the wire assembly are byte-identical across the small UI gap between the on-disk checkout and origin/main, so every logic claim holds and each is cited to a file:line.</p>
  <p><b>Screenshots.</b> Real-stack captures of our own built screen: a fresh migrated database, the seeded mapped Primary logged in through the real UI, zero injected data. ${D.haveShots?`${D.allimgs.length} screenshot(s) embedded.`:'No screenshots embedded in this build (the capture is reported separately).'}</p>
  <p><b>Comments.</b> Answers post to this page's own Supabase table <code>computation_review_comments</code> (separate from the FTA audit's table), page id <code>computation-review-2026-08</code>, insert-only. If the network is down they are kept in the browser and auto-sync on the next load; "Export my answers" (left panel) is the manual fallback. See README.md.</p></div></section>`;
  $('#views').innerHTML=v;
  wire(); status(); remoteFetch().then(()=>{syncPending().then(()=>{remoteFetch().then(()=>{$$('.callbox').forEach(b=>renderC(b.dataset.anchor,$('.clist',b)));markDone();});});}); markDone();
  go((location.hash||'#start').slice(1));
}
window.lb=function(e){$('#lb img').src='img/'+e;$('#lb .cap').textContent=(D.captions[e]||e);$('#lb').classList.add('on');return false;};
window.go=function(id){ if(!$('#v-'+id)) id='start'; $$('.view').forEach(x=>x.classList.remove('on')); $('#v-'+id).classList.add('on'); $$('aside a.nav').forEach(a=>a.classList.toggle('on',a.dataset.view===id)); if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); window.scrollTo(0,0); const a=$(`aside a.nav.on`); a&&a.scrollIntoView({block:'nearest'}); };
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.addEventListener('DOMContentLoaded',()=>{render();$('#lb .x').addEventListener('click',()=>$('#lb').classList.remove('on'));$('#lb').addEventListener('click',ev=>{if(ev.target.id==='lb')$('#lb').classList.remove('on');});$$('aside a.nav').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();go(a.dataset.view);}));});
